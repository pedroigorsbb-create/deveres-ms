<h3>Classificação das missões (1.39–1.42)</h3>
<ul class="plain"><li><b>Missão de voo:</b> toda missão em que o deslocamento se faz pelo ar. Quanto à finalidade: <b>aerotransporte</b> (sem lançamento) ou <b>lançamento</b> (há lançamento por paraquedas).</li>
<li><b>Quanto ao tipo:</b> <b>voo</b> = dentro de um raio de até <b>100 km</b> do aeródromo de partida · <b>viagem</b> = ultrapassa 100 km.</li>
<li><b>Execução do lançamento:</b> semiautomático · livre (comandado) · lançamento de bordo (gravidade/liberação, rasante, extração).</li>
<li><b>Natureza:</b> adestramento · demonstração · instrução · manobra ou tático · operações ou combate · salvamento ou socorro · busca · reconhecimento · resgate · competição · ensaio ou pesquisa.</li>
<li><b>Participantes:</b> pessoal · material leve · material pesado · pessoal e animal · misto (pessoal e material leve).</li></ul>
<h3>O código (1.43)</h3>
<p>Três grupos separados por hífen; cada grupo tem de 1 a 3 indicativos de 1 ou 2 letras.</p>
<div class="tbl"><table><tr><th>Grupo</th><th>Indicativo</th><th>Códigos</th></tr>
<tr><td rowspan="3"><b>1º</b></td><td>tipo</td><td>voo (sem letra) · <b>V</b> viagem</td></tr><tr><td>finalidade</td><td>aerotransporte (sem letra própria) · <b>L</b> lançamento · voo+aerotransporte = <b>T</b></td></tr><tr><td>execução (só lançamento)</td><td>semiautomático (sem letra) · <b>E</b> extração · <b>G</b> gravidade/liberação · <b>R</b> rasante · <b>L</b> livre</td></tr>
<tr><td rowspan="4"><b>2º</b></td><td>natureza</td><td><b>A</b> adestramento · <b>D</b> demonstração · <b>I</b> instrução · <b>M</b> manobra/tático · <b>O</b> operações/combate · <b>S</b> salvamento/socorro · <b>B</b> busca · <b>R</b> reconhecimento · <b>U</b> resgate · <b>C</b> competição · <b>E</b> ensaio/pesquisa</td></tr><tr><td>participantes</td><td><b>H</b> pessoal · <b>Y</b> pessoal e animal · <b>X</b> misto · <b>F</b> material leve · <b>S</b> material pesado</td></tr><tr><td>realização (só lançamento)</td><td>porta de salto (sem letra) · <b>C</b> porta de carga/rampa</td></tr><tr><td>formatura (só lançamento)</td><td>aeronave isolada (sem letra) · <b>G</b> formatura</td></tr>
<tr><td><b>3º</b></td><td>horário</td><td><b>D</b> diurno · <b>N</b> noturno · <b>DN</b> diurno-noturno · <b>ND</b> noturno-diurno</td></tr></table></div>
<p><b>1º grupo possível:</b> T · V · L · LE · LG · LR · LL · VL · VLE · VLG · VLR · VLL.</p>
<h3>Regras (1.44)</h3>
<ol type="a" class="plain"><li>Sempre grupos separados por hífen; nº de letras varia.</li><li>Enunciado fora de ordem: o código mantém a ordem padrão.</li><li>Atenção: T, V, L, VL, O, M, U, R, G.</li><li><b>Aerotransporte omite:</b> execução, porta de carga e formatura.</li><li><b>Lançamento omite:</b> “voo”; semiautomático; porta de salto; aeronave isolada.</li><li><b>Material pesado (S) não leva C</b> (porta de carga implícita).</li><li>Finalidade omitida → aerotransporte.</li><li>Lançamento sem execução, realização e formatura → semiautomático, porta lateral, aeronave isolada.</li><li>Não há lançamento simultâneo pelas portas de salto e de carga na mesma missão.</li><li>Missões parciais diferentes na mesma Anv → um código para cada.</li></ol>
<h3>Decodificação (1.45–1.46)</h3>
<p><b>Aerotransporte:</b> 4 itens obrigatórios (tipo, natureza, participantes, horário) + 1 opcional (finalidade). <b>Lançamento:</b> os <b>8 itens</b> — tipo, finalidade, execução, natureza, participantes, realização, formatura e horário — inclusive “voo”, “semiautomático”, “porta de salto” e “aeronave isolada”.</p>

cite('doc','O Sr, desempenhando função na 3ª Seç em sua OM Pqdt, deverá elaborar um documento em <b>5 vias</b>, no qual são registradas informações como participantes e material leve a ser utilizado na missão de voo, lançamento ou aerotransporte. Para isso, deverá consultar um <b>segundo documento</b>, confeccionado e emitido pelo Cmdo Bda Inf Pqdt para tornar público em sua OM as missões de voo, lançamentos e viagens a serem executadas; sua distribuição acontece até o penúltimo dia útil de cada mês e consta de dados técnicos e administrativos. Cite, respectivamente, o número da Parte Qualificada e o nome por extenso dos dois documentos, bem como para quem o MS Av deverá destinar cada uma das 5 vias do primeiro documento.',[['1º documento: PQ-2','=PQ 2|=PQ2'],['Manifesto de Voo e Lançamento','MANIFESTO'],['2º documento: PQ-1','=PQ 1|=PQ1'],['Aditamento (Mensal/Periódico) de Atividades Aeroterrestres','ADITAMENTO'],['2 vias para o DOMPSA (P Distr Mat Aet e P Col Mat Aet)','DOMPSA'],['1 via para o O Lig (3ª Seç GU)','LIG|LIGACAO|EQUIPE TERRA|PREC'],['1 via para a 3ª Seç da OM (S3)','S3|3 SEC|3A SEC|TERCEIRA SEC|SECAO DA OM|SECAO DE SUA OM'],['1 via para a tripulação','TRIPULA']],'MT 1.38.1–1.38.2: 1ª P Distr Mat Aet (DOMPSA) · 2ª O Lig (3ª Seç GU) · 3ª 3ª Seç da OM · 4ª tripulação · 5ª P Col Mat Aet (DOMPSA). Na prova 24/1 foram aceitas “2 para o DOMPSA, 1 para o S3, 1 para o chefe da equipe terra e 1 para a tripulação” — pelo MT, a via é do O Lig.','MT 1.38.1 e 1.38.2',P24);
flds('doc','O Sr, tendo sido transferido de OM Pqdt para outra não Pqdt, solicitou à 3ª Seção um documento através do qual são transmitidas informações como data do último salto realizado no posto ou graduação e o número de cotas incorporadas para fins de indenização de compensação orgânica. Esse documento é elaborado em duas vias, uma para arquivo na OM de origem e outra para a OM de destino. Cite o número e o nome por extenso.',pqF(9),'MT 1.38.9.','MT 1.38.9',P24);
cite('doc','Durante uma missão de lançamento, um saltador não executou uma boa saída e sofreu um choque no pescoço na abertura do velame. Ao chegar ao solo, foi atendido pelo médico da missão, que decidiu que <b>não havia necessidade</b> de confeccionar a Parte Qualificada que trata de acidentes. O Precursor chefe da Equipe Terra acompanhou a situação, pois é sua atribuição registrar todas as ocorrências técnicas em um documento. Cite o número e o nome da PQ que o médico decidiu não ser necessária, se o MS Av deve ou não acatar a decisão (com o motivo), e o número e o nome da PQ confeccionada pelo precursor.',[['PQ-6 — Parte de Acidente(s)','PQ 6|PQ6|PARTE DE ACIDENTE'],['O MS Av deve acatar a decisão do médico','ACATAR|DEVE'],['porque a abertura da PQ-6 é decidida pelo médico','MEDICO'],['PQ-5 — Relatório do Chefe da Equipe Terra','PQ 5|PQ5|RELATORIO']],'MT 1.38.5 e 1.38.6; anotação do memento: “o médico decide a abertura ou não da PQ-6”.','MT 1.38.5–1.38.6 · memento',P24);
cite('doc','No dia seguinte ao salto, um cabo procurou o MS Av dizendo estar com o pé esquerdo doendo, alegando tê-lo torcido no dia do salto. Como ainda estava dentro do período de 48 horas, o MS Av o encaminhou ao médico que estava na missão, para que fosse confeccionada uma PQ-6. A decisão do MS Av foi correta? Justifique.',[['Sim, foi correta','SIM|CORRET'],['pois só o médico pode decidir (dar a ordem) pela abertura da PQ-6','MEDICO']],'Gabarito da prova 24/1 (item 9): “Sim, pois só o médico pode dar a ordem para abrir a PQ-6”.','Memento · prova 24/1',P24);

const SERAFIM='<b>1ª situação particular.</b> O Sr foi escalado como MS do 1º Av na Op SERAFIM, exercício de conquista e manutenção de cabeça de ponte aérea da Bda Inf Pqdt, em RESENDE-RJ. A infiltração foi realizada por uma Anv <b>KC-390</b>. O Sr realizou em D um lançamento semiautomático de pessoal a 1.000 pés, pela porta de salto; <b>2 fardos A-5</b> foram lançados no mesmo avião. Em D+2, o 2º Sgt MARTINHO, DOMPSA do 20º B Log Pqdt, recebeu a missão de lançar um <b>A-Log</b> para reabastecer a tropa, com uma Anv <b>C-105</b>, pela porta de carga. Ambas decolaram da BASE AÉREA DOS AFONSOS (RJ) e lançaram na ZL NOVA DUTRA (RESENDE-RJ). Tempo de voo e distância Base Aérea–ZL: <b>1 hora e 150 km</b>. HSO: <b>0600P de D</b> (KC-390) e <b>1740P de D+2</b> (C-105). ICMN <b>0550P</b> e FCVN <b>1800P</b>.';
flds('cod','Registre os códigos das missões especificadas na situação.',[['a. KC-390','VL-MX-ND','=VL MX ND'],['b. C-105','VL-MS-DN (gabarito da prova)','=VL MS DN|=VL MFC DN']],'KC-390: 150 km > 100 km → viagem (V); lançamento semiautomático (L, sem letra de execução); manobra (M); pessoal + fardos = misto (X); porta de salto e isolada (sem letra); decola ~0500 (antes do ICMN 0550 → noturno) e lança 0600 (diurno) → ND. C-105: viagem com lançamento; manobra; o gabarito da prova 24/1 aceitou <b>VL-MS-DN</b> (A-Log tratado como material pesado: S sem C, regra m); decola ~1640 (diurno) e regressa após o FCVN 1800 → DN. Observação: pelo MT o A-Log é pacote da série A (até 500 lb); se tratado como material leve pela rampa, seria VL-MFC-DN — confirme com o instrutor.','MT 1.43–1.44 · prova 24/1',Object.assign({ctx:SERAFIM},P24));
cite('cod','Durante a Op GRADE, após o assalto aeroterrestre, o Batalhão DOMPSA recebeu a missão de ressuprir a FT AFONSOS com o código <b>LE-MSG-D</b>, utilizando uma Anv C-105 AMAZONAS. Decodifique a missão.',[['Voo com lançamento','VOO'],['por extração','EXTRA'],['de manobra (tático)','MANOBRA|TATICO'],['de material pesado (carga pesada)','PESAD'],['pela porta de carga/rampa','CARGA|RAMPA'],['aeronaves em formatura','FORMA'],['diurno','DIURN']],'LE = voo (sem letra) + L lançamento + E extração · M manobra · S material pesado (porta de carga implícita) · G formatura · D diurno. Na decodificação de lançamento constam os 8 itens.','MT 1.43–1.46',P24);
cite('cod','Identifique, pela decodificação, a missão <b>T-RY-D</b> realizada na Op SERAFIM.',[['Voo de aerotransporte','VOO'],['de reconhecimento (R) — pelo MT, Tab 6.1','RECONHEC|RESGATE'],['com pessoal e animal (Y)','ANIMAL'],['diurno (D)','DIURN']],'T = voo de aerotransporte · <b>R = RECONHECIMENTO</b> (Tab 6.1; resgate é U) · Y = pessoal e animal · D = diurno. Em aerotransporte, execução, realização e formatura não são citadas. Atenção: na prova 24/1 a resposta “de resgate” recebeu os pontos, mas pelo MT o correto é reconhecimento — o app aceita as duas e recomenda escrever “reconhecimento”.','MT 1.43.3.3 · prova 24/1',{src:'prova 24/1 (ver nota)'});

function letraSVG(L,st,night,wrongRed){const D=LETTERS[L];const u=26,ox=150,oy=34;const yel=night?'#F2A33A':'#E9C531',red='#D2362B';
  const panel=(x,y,o,c)=>{const X=ox+x*u,Y=oy+y*u;if(night)return `<circle cx="${X}" cy="${Y}" r="6" fill="${c}" stroke="#000" stroke-width="1"/>`;const w=o==='h'?22:9,h=o==='h'?9:20;const rot=o==='du'?-40:o==='dd'?40:0;return `<rect x="${X-w/2}" y="${Y-h/2}" width="${w}" height="${h}" fill="${c}" stroke="#111" stroke-width="1" transform="rotate(${rot} ${X} ${Y})"/>`};
  let perna=D.perna.map((p,i)=>[p[0],p[1],'v',(st==='temp'||st==='def'||st==='descL')&&i<2?red:yel]);if(wrongRed)perna=D.perna.map((p,i)=>[p[0],p[1],'v',i>=2?red:yel]);
  const arms=st==='def'?[]:D.arms.map(a=>[a[0],a[1],a[2],yel]);
  const maxY=Math.max(...D.perna.map(p=>p[1]),...D.arms.map(a=>a[1]));const advY=maxY+4.4;const advRed=st==='temp'||st==='def'||st==='descA';
  const px=D.perna[0][0];const adv=[[-1.5,'e'],[-.5,'c'],[.5,'c'],[1.5,'e']].map(([dx,k])=>[px+dx*(night?.9:1.3),advY,'h',advRed&&k==='c'?red:yel]);
  const H=oy+advY*u+40;
  return `<svg viewBox="0 0 300 ${H}" class="fig lc" role="img" aria-label="Letra código e linha de advertência"><rect x="0" y="0" width="300" height="${H}" fill="${night?'#1d2440':'#3f5d2a'}" rx="6"/>${[...perna,...arms,...adv].map(p=>panel(p[0],p[1],p[2],p[3])).join('')}
   <line x1="${ox+px*u+34}" y1="${oy+D.perna[0][1]*u+6}" x2="${ox+px*u+34}" y2="${oy+advY*u-8}" stroke="#fff" stroke-dasharray="3 3"/><text x="${ox+px*u+40}" y="${oy+(D.perna[0][1]+advY)/2*u}" fill="#fff" font-size="11">150 m</text>
   <text x="12" y="${H-12}" fill="#fff" font-size="11">↑ entrada da aeronave</text></svg>`}

<h3>Interfone e fraseologia (1.36)</h3>
<p>O interfone mantém a ligação entre o piloto e um tripulante, o MS Av ou o responsável pelo lançamento (Prec, MS Eq). A fraseologia segue o <b>MCA 55-20</b>. O militar do Exército que opera o interfone (ligação MS Av–piloto) deve ser <b>obrigatoriamente um MS</b>.</p>
<h3>Sinais convencionados (1.37)</h3>
<div class="two"><div class="tbl"><table><tr><th colspan="2">Avião no solo</th></tr><tr><td>Luz vermelha</td><td>impedimento para embarque/desembarque</td></tr><tr><td>Luz verde</td><td>autorização para embarque/desembarque</td></tr><tr><td>1 toque longo</td><td>advertência para início do táxi ou da decolagem</td></tr><tr><td>2 toques curtos</td><td>piloto chamando o MS Av</td></tr></table></div>
<div class="tbl"><table><tr><th colspan="2">Avião em voo</th></tr><tr><td>Luz vermelha</td><td>advertência de abertura da rampa / autorização para abrir as portas, a 4 min da ZL e na altura prevista</td></tr><tr><td>Luz verde</td><td>avião em condições de lançamento (10 a 6 s antes do ponto); na LV, é o “já”</td></tr><tr><td>1 toque longo</td><td>advertência para o pouso, mau tempo ou impedimento do piloto</td></tr><tr><td>2 toques curtos</td><td>piloto chamando o MS Av</td></tr><tr><td>3 toques longos</td><td>perigo a bordo (aterragem forçada/amerissagem)</td></tr><tr><td>3 toques curtos</td><td>preparar para abandonar a aeronave</td></tr><tr><td>Toque contínuo</td><td>iminência de choque</td></tr><tr><td>1 toque longo + luz verde</td><td>ordem de abandono da aeronave</td></tr><tr><td>1 toque longo + luz vermelha</td><td>impedimento do piloto para o lançamento</td></tr></table></div></div>
<h3>Regras de exploração do interfone (6.2)</h3>
<div id="rotList"></div>
${EXAM(`<p>Na prova 24/1 a conversação veio numa <b>tabela (letras a, b, c…)</b>, com as falas do piloto e do Prec escritas e as do Op Intf em branco. Dicas que valeram ponto:</p><ul class="plain"><li>Se a próxima fala do piloto é “<b>PROSSIGA!</b>”, a sua é “<b>PILOTO – INTER!</b>” — inclusive antes de repassar a correção do Prec.</li><li>Coteje sempre: vento ao piloto, vento ao Prec, entrada ao Prec, “NA FINAL!”, “NA ROTA!”.</li><li>Ao repassar ao Prec ou ao MS escreva <b>(VOZ E GESTO)</b>.</li><li>“JÁ!” após a saída do Prec e após a saída do MS na vertical da letra código.</li><li>Antes da última passagem: “<b>FITAS A BORDO, PRÓXIMA PASSAGEM SERÁ A ÚLTIMA!</b>”. No fim: “<b>TODOS FORA, VOU RECOLHER FITAS!</b>” e “<b>FITAS A BORDO E RAMPA LIVRE PARA FECHAMENTO!</b>” (onde mais se perdeu ponto).</li></ul>`)}
${TRAP('“HOMENS FORA” é para equipes intermediárias e homem preso; “TODOS FORA” é só após a última equipe. No exercício 3 do curso (C-95, sem rampa), a última fala foi “FITAS A BORDO! PORTA FECHADA!”.')}`;

  const next=()=>{const m=cRandom(),code=cCode(m);A.innerHTML=`<div class="sesshead"><span class="mono">${ok}/${n}</span><span class="muted sm">Escolha o significado de cada item; “não se aplica” para o que não existe em aerotransporte.</span></div><div class="enun"><span class="lbl">Decodifique</span><div class="bigcode">${codeHTML(code)}</div></div><div class="flds">${DF.map(([k,l,o])=>`<label class="fl" id="dw_${k}" for="dd_${k}"><span>${l}</span><select id="dd_${k}"><option value="">—</option>${Object.entries(o).map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select><em class="fldmsg" id="de_${k}"></em></label>`).join('')}</div><div class="btns"><button class="b" id="ddOk">Conferir</button></div><div id="ddFb"></div>`;
    $('#ddOk').addEventListener('click',()=>{const aero=m.fin==='aero';let all=true;const exp={tipo:[m.tipo],fin:aero?['aero','omit']:['lanc'],exec:aero?['omit']:[m.exec],nat:[m.nat],part:[m.part],real:aero?['omit']:[realOf(m)],form:aero?['omit']:[m.form],hor:[m.hor]};let g=0;
      DF.forEach(([k,,o])=>{const v=$('#dd_'+k).value,good=exp[k].includes(v);if(good)g++;else all=false;$('#dw_'+k).classList.add(good?'okF':'badF');$('#de_'+k).textContent=good?'':'Correto: '+exp[k].map(x=>o[x]).join(' ou ');$('#dd_'+k).disabled=true});
      n++;if(all)ok++;recTag('cod',g,DF.length);$('#ddFb').innerHTML=`<div class="fb ${all?'ok':'bad'}"><h4>${all?'Correto':'Revise os campos em vermelho'}</h4><p><b>Decodificação:</b> ${cSentence(m)}</p>${cWhy(m)}</div><div class="btns"><button class="b" id="ddNx">Próximo código</button></div>`;$('#ddOk').disabled=true;$('#ddNx').addEventListener('click',next)})};next()}
/* ---------- painel ---------- */
function renderPainel(sec){const tot=Object.values(DB.it).reduce((a,s)=>a+s.n,0);let g=0,m=0;Object.values(DB.tp).forEach(s=>{g+=s[0];m+=s[1]});const p=m?Math.round(g/m*100):null;const provas=DB.hist.filter(h=>h.k==='Prova');const best=provas.length?Math.max(...provas.map(h=>Math.round(h.got/h.max*100))):null;const days=Object.keys(DB.day).length;
  const rows=TABS.filter(t=>t.tp).map(t=>{const s=tpStats(tpKey(t));return {t,s}});const scored=rows.filter(r=>r.s.p!=null).sort((a,b)=>a.s.p-b.s.p);const weak=scored.filter(r=>r.s.p<85).slice(0,3);const strong=scored.slice().reverse().filter(r=>r.s.p>=85).slice(0,3);const unseen=rows.filter(r=>r.s.p==null);
  const errs=BANK.filter(i=>DB.it[i.id]&&DB.it[i.id].l<1).sort((a,b)=>(DB.it[b.id].w-DB.it[a.id].w)||(DB.it[a.id].l-DB.it[b.id].l));
  sec.innerHTML=`<div class="hero"><h2>Prova de Deveres do MS</h2><p>Capítulo I do MT 3.57-201 inteiro, PQ-2, PQ-6, conversação e codificação — com questões no estilo das provas do curso (situação-problema, “cite”, “C ou I”, correlação, tabela, cálculo) e correção comentada com a referência do manual.</p></div>
  <div class="kpis"><div class="kpi"><b>${tot}</b><span>respostas</span></div><div class="kpi"><b style="color:${p==null?'inherit':pctColor(p)}">${p==null?'—':p+'%'}</b><span>acerto geral (escores)</span></div><div class="kpi"><b>${provas.length}</b><span>provas simuladas</span></div><div class="kpi"><b>${best==null?'—':best+'%'}</b><span>melhor prova</span></div><div class="kpi"><b>${BANK.length}</b><span>questões no banco + geradas</span></div><div class="kpi"><b>${days}</b><span>dias de estudo</span></div></div>
  <div class="two" style="margin-top:14px"><div class="card"><h4>Precisa de atenção</h4>${weak.length?`<ul class="plain">${weak.map(r=>`<li><b>${r.t.n}</b> · ${r.s.p}% <button class="b sm" data-go="${r.t.id}:prova">Treinar</button></li>`).join('')}</ul>`:'<p class="sm muted">Responda algumas questões para o app medir seus pontos fracos.</p>'}${unseen.length?`<p class="sm">Ainda não treinados: ${unseen.map(r=>`<a href="#" data-go="${r.t.id}:res">${r.t.n}</a>`).join(' · ')}</p>`:''}</div>
   <div class="card"><h4>Mais seguro</h4>${strong.length?`<ul class="plain">${strong.map(r=>`<li><b>${r.t.n}</b> · ${r.s.p}%</li>`).join('')}</ul>`:'<p class="sm muted">Temas com 85% ou mais aparecem aqui.</p>'}<div class="btns"><button class="b" id="pnMix">Treino misto (tudo)</button><button class="b alt" id="pnErr" ${errs.length?'':'disabled'}>Revisar meus erros (${errs.length})</button></div></div></div>
  <h3>Desempenho por matéria</h3><div class="tbl"><table class="perf"><tr><th>Matéria</th><th>Acerto</th><th>Banco visto</th><th></th></tr>${rows.map(({t,s})=>`<tr><td><a href="#" data-go="${t.id}:res">${t.n}</a></td><td>${s.p==null?'<span class="muted">—</span>':`<div class="mbar"><i style="width:${s.p}%;background:${pctColor(s.p)}"></i></div><b>${s.p}%</b> <span class="muted sm">(${fmtN(Math.round(s.g*10)/10)}/${s.m})</span>`}</td><td class="mono">${s.seen}/${s.tot}</td><td><button class="b alt sm" data-go="${t.id}:prova">Treinar</button></td></tr>`).join('')}</table></div>
  ${errs.length?`<h3>Questões que você mais errou</h3><ul class="errs">${errs.slice(0,8).map(i=>`<li><span class="chip">${TOPICS[i.tp].s}</span> ${i.q.replace(/<svg[\s\S]*?<\/svg>/g,'').replace(/<[^>]+>/g,' ').slice(0,150)}… <b class="muted sm">(${DB.it[i.id].w} erro${DB.it[i.id].w>1?'s':''})</b></li>`).join('')}</ul>`:''}
  <h3>Histórico</h3>${DB.hist.length?`<div class="tbl"><table><tr><th>Quando</th><th>Atividade</th><th>Resultado</th></tr>${DB.hist.slice(-15).reverse().map(h=>`<tr><td class="mono sm">${new Date(h.t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</td><td>${esc(h.k)}${h.s?' · '+esc(h.s):''}${h.tp&&!Array.isArray(h.tp)&&TOPICS[h.tp]?' · '+TOPICS[h.tp].s:''}</td><td><b style="color:${pctColor(Math.round(h.got/h.max*100))}">${Math.round(h.got/h.max*100)}%</b> <span class="muted sm">${fmtN(Math.round(h.got*10)/10)}/${h.max}</span></td></tr>`).join('')}</table></div>`:'<p class="muted sm">Sem atividades ainda.</p>'}
  <div class="card" style="margin-top:14px"><h4>Como estudar com o app</h4><ol class="steps"><li><b>Resumo</b> de cada matéria (com “Como cai na prova” e as pegadinhas).</li><li><b>Questões de prova</b> até passar de 85% — elas são escritas como as da prova e a correção mostra o gabarito e o item do MT. Se escreveu com outras palavras, toque em “aceitar”.</li><li><b>Quiz rápido e flashcards</b> para fixar números e listas.</li><li>Faça a <b>PQ-2 e a PQ-6</b> da prova 24/1 no simulador e depois missões geradas.</li><li><b>Prova simulada</b> A (UD I) e B (documentos e conversação), com tempo; refaça o que errou em “Revisar meus erros”.</li></ol><p class="sm muted">O app escolhe primeiro as questões que você ainda não viu e as que errou. As geradas mudam números, aeronaves e situações a cada vez.</p><div class="btns"><button class="b alt sm" id="pnReset">Apagar meu progresso</button></div></div>`;
  sec.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();goto(b.dataset.go)}));
  $('#pnMix').addEventListener('click',()=>{sec.innerHTML='<div class="thead"><h2>Treino misto</h2></div><div id="mixA" class="area"></div><div class="btns"><button class="b alt" id="mixBack">Voltar ao painel</button></div>';practice($('#mixA'),{tp:ALLTP,label:'Todas as matérias, priorizando o que você não viu ou errou'});$('#mixBack').addEventListener('click',()=>renderPainel(sec))});
  const eb=$('#pnErr');if(eb)eb.addEventListener('click',()=>{sec.innerHTML='<div class="thead"><h2>Revisão dos erros</h2></div><div id="errA" class="area"></div><div class="btns"><button class="b alt" id="errBack">Voltar ao painel</button></div>';practice($('#errA'),{next:()=>{const E=BANK.filter(i=>DB.it[i.id]&&DB.it[i.id].l<1);return E.length?pickW(E,1)[0]:nextItem(ALLTP)},label:'Questões que você errou da última vez'});$('#errBack').addEventListener('click',()=>renderPainel(sec))});
  $('#pnReset').addEventListener('click',e=>{const b=e.currentTarget;if(!b.dataset.arm){b.dataset.arm='1';b.textContent='Toque de novo para confirmar';return}DB={it:{},tp:{},hist:[],fc:{},day:{}};save();renderPainel(sec)})}
/* ---------- aba de provas ---------- */
function renderProvaTab(sec){sec.innerHTML=`<div class="thead"><h2>Prova simulada</h2><span class="ref">Formato das provas do Turno 24/1 · correção ao entregar</span></div>
  <div class="cards"><div class="card"><h4>Prova A · UD I</h4><p class="sm">Situação-problema com anexos (formação in trail e croquis das ZL): funções, preparação, aeródromo, circuito, sinais, cálculos, equipe terra, letra código, reorganização e briefing. Nova a cada vez.</p><button class="b" data-p="A">Começar</button></div>
  <div class="card"><h4>Prova B · Documentos e conversação</h4><p class="sm">Documentos (PQ), codificação e decodificação em situação, conversação no formato de tabela e itens de PQ-2/PQ-6. Depois, a parte prática no simulador.</p><button class="b" data-p="B">Começar</button></div>
  <div class="card"><h4>Réplicas da prova 24/1</h4><p class="sm">As questões da prova real, com os mesmos dados, para medir sua nota.</p><button class="b" data-p="R1">UD I</button> <button class="b alt" data-p="R2">Documentos e conversação</button></div>
  <div class="card"><h4>Prova personalizada</h4><div class="chks">${ALLTP.map(t=>`<label><input type="checkbox" value="${t}" checked> ${TOPICS[t].s}</label>`).join('')}</div><div class="bar"><label class="f" for="pcN">Questões<select id="pcN"><option>10</option><option selected>20</option><option>30</option><option>40</option></select></label><label class="f" for="pcS">Estilo<select id="pcS"><option value="prova">Só discursivas (estilo prova)</option><option value="mix">Misto (inclui múltipla escolha)</option></select></label></div><button class="b" data-p="C">Montar prova</button></div></div>
  <div class="bar"><label class="f" for="pLim">Tempo<select id="pLim"><option value="0">Sem limite (cronômetro)</option><option value="60">60 min</option><option value="90" selected>90 min</option><option value="120">120 min</option></select></label></div><div id="provaArea"></div>`;
  sec.querySelectorAll('[data-p]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.p;let P0;if(k==='A')P0=buildProvaA();else if(k==='B')P0=buildProvaB();else if(k==='R1')P0=buildReplica(1);else if(k==='R2')P0=buildReplica(2);else{const tps=$$('.chks input:checked').map(x=>x.value);if(!tps.length)return;P0=buildCustom(tps,+$('#pcN').value,$('#pcS').value)}
    const area=$('#provaArea');delete area.dataset.done;runProva(area,P0,{limit:+$('#pLim').value});area.scrollIntoView({behavior:'smooth'})}))}
/* ---------- início ---------- */
function init(){BANK.forEach(it=>{if(typeof it.q==='string'){if(it.q.includes('__CIRC__'))it.q=it.q.replace('__CIRC__',circuitSVG({}));if(it.q.includes('__LCT__'))it.q=it.q.replace('__LCT__',letraSVG('T','temp',false))}});
  buildUI();let t=(location.hash||'').slice(1);if(!TABS.some(x=>x.id===t))t=ST.get('dms_tab','painel');if(!TABS.some(x=>x.id===t))t='painel';showTab(t)}
init();

</script></body></html>
