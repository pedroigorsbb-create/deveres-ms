<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Deveres do MS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap">
<style>:root{
  --bg:#EDEFE5;--surface:#F8F9F3;--surface2:#E3E6D8;--ink:#1B2016;--muted:#5A6150;--line:#C9CEBA;
  --olive:#4B5320;--olive-ink:#FFFFFF;--amber:#B8770F;--paper:#FFFFFF;--red:#C0271C;
  --ok:#23813A;--okbg:#D8EFDC;--bad:#B42F24;--badbg:#F6DAD6;--warn:#9A6B00;--warnbg:#F5E8C4;
  --shadow:0 1px 2px rgba(30,36,20,.08),0 6px 18px rgba(30,36,20,.06);
  --display:"Oswald","Arial Narrow",Impact,sans-serif;--body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;--form:"Times New Roman",Times,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12150E;--surface:#1B1F15;--surface2:#252A1D;--ink:#E5E8DA;--muted:#A3AA92;--line:#343A2A;--olive:#8E9B55;--olive-ink:#12150E;--amber:#E2A83E;--paper:#1F2419;--red:#F07A6E;--ok:#5FD17A;--okbg:#173220;--bad:#F07A6E;--badbg:#3A1714;--warn:#E8BE55;--warnbg:#382B0C;--shadow:0 1px 2px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12150E;--surface:#1B1F15;--surface2:#252A1D;--ink:#E5E8DA;--muted:#A3AA92;--line:#343A2A;--olive:#8E9B55;--olive-ink:#12150E;--amber:#E2A83E;--paper:#1F2419;--red:#F07A6E;--ok:#5FD17A;--okbg:#173220;--bad:#F07A6E;--badbg:#3A1714;--warn:#E8BE55;--warnbg:#382B0C;--shadow:0 1px 2px rgba(0,0,0,.4)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body)}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:0 72px}
h1,h2,h3,h4{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;line-height:1.15;text-wrap:balance;margin:0}
h2{font-size:1.5rem;margin-block:30px 12px}h3{font-size:1.08rem;margin-block:20px 8px;color:var(--olive)}
p{margin:0 0 10px;max-width:72ch}.muted{color:var(--muted)}.sm{font-size:.86rem}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:10px 16px 0;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.brand h1{font-size:1.35rem}
.ref{font-family:var(--mono);font-size:.74rem;color:var(--muted)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{font:600 .8rem var(--display);text-transform:uppercase;letter-spacing:.08em;background:none;border:0;color:var(--muted);padding:9px 11px 10px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--amber)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.card h4{font-size:.98rem;letter-spacing:.06em;margin:0 0 6px}.card p,.card li{font-size:.9rem}
.callout{border-radius:8px;padding:12px 14px;margin-block:12px;background:var(--surface2)}
.callout.gold{background:var(--warnbg)}.callout strong{font-family:var(--display);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.trap{background:var(--warnbg);border-radius:6px;padding:8px 11px;margin-block:8px;font-size:.88rem}.trap b{color:var(--warn)}
.tbl{overflow-x:auto;margin-block:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font:600 .72rem var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--surface2)}
tr:last-child td{border-bottom:0}
td.n{font:700 .95rem var(--mono);white-space:nowrap;color:var(--olive)}
.ex{font-family:var(--mono);font-size:.82rem;color:var(--red);white-space:nowrap}
ol.steps,ul.plain{margin:6px 0 10px;padding-left:22px}ol.steps li,ul.plain li{margin-bottom:5px}
ol.steps li::marker{font-family:var(--mono);font-weight:700;color:var(--olive)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media (max-width:760px){.two{grid-template-columns:1fr}}
.pqgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.pqc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.pqc .num{font:800 1.5rem var(--mono);color:var(--olive);min-width:58px}
.pqc.hot{border:2px solid var(--amber)}.pqc b{display:block;font-size:.92rem;line-height:1.3}.pqc span{font-size:.8rem;color:var(--muted);line-height:1.35;display:block;margin-top:3px}
.badge{display:inline-block;font:600 .66rem var(--display);letter-spacing:.1em;text-transform:uppercase;background:var(--amber);color:#fff;border-radius:4px;padding:1px 6px;margin-left:4px;vertical-align:middle}
/* simulador */
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-block:6px 14px}
label.f{display:flex;flex-direction:column;gap:3px;font:600 .7rem var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
select,input[type=text],textarea{font:500 .95rem var(--body);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:6px;padding:7px 8px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
button.b{font:600 .84rem var(--display);text-transform:uppercase;letter-spacing:.08em;border-radius:7px;padding:10px 15px;cursor:pointer;border:1.5px solid var(--olive);background:var(--olive);color:var(--olive-ink)}
button.b.alt{background:transparent;color:var(--ink);border-color:var(--line)}
button.b:disabled{opacity:.5;cursor:default}
.brief{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:16px 18px;font:15.5px/1.55 var(--form);box-shadow:var(--shadow)}
.brief ol{margin:8px 0 0;padding-left:26px}.brief li{margin-bottom:3px}.brief li::marker{font-weight:700}
.brief .adapt{font:italic .78rem var(--body);color:var(--warn)}
.brief li.used{opacity:.45;text-decoration:line-through}
.brief li{cursor:pointer}
.form{background:var(--paper);border:1.5px solid var(--ink);margin-block:14px;font-family:var(--form);color:var(--ink)}
.form .fh{text-align:center;padding:8px;border-bottom:1px solid var(--ink);font-size:.86rem;line-height:1.3}
.form .fh u{font-weight:700}
.fg{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-bottom:1px solid var(--ink)}
.fc{border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:3px 5px;display:flex;flex-direction:column;gap:2px;min-width:0}
.fc:last-child{border-right:0}
.fc .l{font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc input{font:600 .92rem var(--mono);border:0;border-bottom:1px dashed var(--line);border-radius:0;background:transparent;color:var(--red);padding:3px 2px;text-transform:uppercase}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:span 6}
@media (max-width:760px){.fg{grid-template-columns:repeat(2,minmax(0,1fr))}.s3,.s4{grid-column:span 2}.s6{grid-column:span 2}}
.fc.okF input{background:var(--okbg)}.fc.badF input{background:var(--badbg)}.fc.warnF input{background:var(--warnbg)}
.mbody{overflow-x:auto;border-top:1px solid var(--ink)}
.mbody table{font-family:var(--form);font-size:.82rem;min-width:860px;border-collapse:collapse}
.mbody th{font:600 .68rem var(--form);text-transform:none;letter-spacing:0;color:var(--ink);background:transparent;border:1px solid var(--ink);text-align:center;padding:3px}
.mbody td{border:1px solid var(--ink);padding:0;vertical-align:middle}
.mbody input[type=text]{font:600 .8rem var(--mono);border:0;border-radius:0;background:transparent;padding:4px 4px;color:var(--ink);text-transform:uppercase}
.mbody tr.pre input{color:var(--ink)}.mbody tr.new input{color:var(--red)}
.mbody tr.struck td input{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px}
.mbody tr.struck{background:repeating-linear-gradient(0deg,transparent 0 48%,var(--red) 48% 52%,transparent 52% 100%)}
.mbody tr.okR{background:var(--okbg)}.mbody tr.badR{background:var(--badbg)}
.mbody td.c{text-align:center}
.mbody .w-ord{width:46px}.mbody .w-om{width:92px}.mbody .w-pg{width:70px}.mbody .w-nr{width:82px}.mbody .w-obs{width:110px}.mbody .w-x{width:40px}
.inutil{display:flex;gap:8px;align-items:center;padding:8px 10px;font:600 .84rem var(--body);border-top:1px solid var(--ink)}
.results{margin-top:14px}
.score{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow)}
.score .big{font:800 2.1rem var(--mono);font-variant-numeric:tabular-nums}
.score .pct{font:700 1.1rem var(--mono);color:var(--muted)}
.meter{flex:1;min-width:160px;height:10px;background:var(--surface2);border-radius:6px;overflow:hidden}.meter i{display:block;height:100%}
.rl{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px}
.rl li{display:grid;grid-template-columns:22px minmax(120px,210px) 1fr;gap:10px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:6px;padding:7px 10px;font-size:.88rem}
.rl li.bad{border-left-color:var(--bad)}.rl li.warn{border-left-color:var(--warn)}
.rl .ic{font-weight:800}.rl li .ic{color:var(--ok)}.rl li.bad .ic{color:var(--bad)}.rl li.warn .ic{color:var(--warn)}
.rl .lb{font:600 .78rem var(--display);text-transform:uppercase;letter-spacing:.05em}
.rl .ex2{font-family:var(--mono);font-size:.8rem}
.rl .msg{display:block;color:var(--muted);font-size:.84rem;margin-top:2px}
@media (max-width:620px){.rl li{grid-template-columns:22px 1fr}.rl li>div{grid-column:1/-1}}
.filter{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.filter button{font:600 .74rem var(--display);text-transform:uppercase;letter-spacing:.06em;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:20px;padding:5px 11px;cursor:pointer}
.filter button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.gabnote{font-size:.84rem;background:var(--warnbg);border-radius:6px;padding:8px 11px;margin-top:10px}
/* PQ-6 */
.pq6{padding:14px 16px;font-family:var(--form);font-size:.95rem}
.pq6 .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.pq6 .row>label{display:flex;gap:6px;align-items:center;flex:1 1 220px}
.pq6 .row>label>span{white-space:nowrap}
.pq6 input[type=text],.pq6 textarea{font:600 .9rem var(--mono);color:var(--red);background:transparent;border:0;border-bottom:1px dashed var(--line);border-radius:0;text-transform:uppercase}
.pq6 textarea{border:1px dashed var(--line)}
.pq6 h5{font:700 .95rem var(--form);margin:14px 0 6px}
.pq6 .mini{overflow-x:auto}.pq6 .mini table{min-width:640px;font-family:var(--form)}
.pq6 .mini th{font:600 .72rem var(--form);text-transform:none;letter-spacing:0;color:var(--ink);background:transparent;border:1px solid var(--ink);text-align:center}
.pq6 .mini td{border:1px solid var(--ink);padding:0}
.pq6 .mini input{border:0!important}
.radios{display:flex;gap:12px;flex-wrap:wrap;font-size:.9rem}.radios label{display:flex;gap:4px;align-items:center}
.okF{background:var(--okbg)!important}.badF{background:var(--badbg)!important}.warnF{background:var(--warnbg)!important}
/* quiz */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:var(--shadow)}
.seg{display:flex;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;width:max-content;max-width:100%;margin-bottom:12px;background:var(--surface)}
.seg button{font:600 .76rem var(--display);text-transform:uppercase;letter-spacing:.08em;background:var(--surface);color:var(--muted);border:0;padding:9px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--olive);color:var(--olive-ink)}
.enun{font-size:1.05rem;font-weight:500;background:var(--surface2);border-radius:8px;padding:14px;margin-bottom:12px}
.enun .lbl{display:block;font:600 .7rem var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.opts{display:grid;gap:8px}
.opts button{text-align:left;font:500 .95rem var(--body);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.opts button.right{border-color:var(--ok);background:var(--okbg)}.opts button.wrong{border-color:var(--bad);background:var(--badbg)}
.fb{margin-top:12px;border-radius:8px;padding:12px 14px}.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}.fb.warn{background:var(--warnbg)}
.fb h4{margin:0 0 6px;font-size:1rem;letter-spacing:.06em}.fb.ok h4{color:var(--ok)}.fb.bad h4{color:var(--bad)}.fb.warn h4{color:var(--warn)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.progress{height:6px;background:var(--surface2);border-radius:4px;overflow:hidden;margin-bottom:12px}.progress i{display:block;height:100%;background:var(--amber)}
/* desempenho */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi b{display:block;font:800 1.6rem var(--mono);font-variant-numeric:tabular-nums}.kpi span{font:600 .7rem var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tagbars{display:grid;gap:6px}
.tagbar{display:grid;grid-template-columns:minmax(140px,240px) 1fr 70px;gap:10px;align-items:center;font-size:.86rem}
.tagbar .t{height:12px;background:var(--surface2);border-radius:6px;overflow:hidden}.tagbar .t i{display:block;height:100%}
.tagbar .v{font:700 .82rem var(--mono);text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:560px){.tagbar{grid-template-columns:1fr 60px}.tagbar .t{grid-column:1/-1;grid-row:2}}
.hist{font-size:.86rem}.hist td{font-variant-numeric:tabular-nums}
section[hidden]{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* conversação */
.cv{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;max-height:60vh;overflow-y:auto}
.cvb{max-width:82%;align-self:flex-start;background:var(--surface2);border-radius:10px 10px 10px 2px;padding:7px 11px;font-size:.93rem}
.cvb.me{align-self:flex-end;background:var(--olive);color:var(--olive-ink);border-radius:10px 10px 2px 10px;font-weight:600}
.cvb.pr{background:var(--warnbg)}
.cvb.me.okc{background:var(--ok);color:#fff}.cvb.me.badc{background:var(--bad);color:#fff}
.cvb .who{display:block;font:600 .66rem var(--display);text-transform:uppercase;letter-spacing:.08em;opacity:.8;margin-bottom:2px}
.cvn{align-self:center;font-size:.8rem;color:var(--muted);font-style:italic;text-align:center}
.cvh{font-size:.85rem;color:var(--amber);margin:10px 0 2px;text-transform:none;letter-spacing:0;font-family:var(--body)}
.cvx{align-self:flex-end;font-size:.8rem;color:var(--bad);font-style:italic}
#cvIn{font:600 1rem var(--mono);text-transform:uppercase}
/* fardos */
.fldmsg{font:500 .78rem var(--body);text-transform:none;letter-spacing:0;color:var(--bad)}
.flash{outline:none}
.insp{display:grid;gap:6px}
.ipr{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.92rem}
.ipr .fldmsg{grid-column:1/-1}
.ipr.okR{background:var(--okbg)}.ipr.badR{background:var(--badbg)}
.ipb{display:flex;gap:4px}.ipb button{font:600 .74rem var(--display);text-transform:uppercase;letter-spacing:.06em;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:6px 9px;cursor:pointer}
.ipb button[aria-pressed="true"][data-v="1"]{background:var(--ok);border-color:var(--ok);color:#fff}.ipb button[aria-pressed="true"][data-v="0"]{background:var(--bad);border-color:var(--bad);color:#fff}
@media (max-width:560px){.ipr{grid-template-columns:1fr}}
.seqdone{display:grid;gap:6px;margin-bottom:10px}.seqdone div{display:flex;gap:10px;align-items:baseline;background:var(--okbg);border-radius:7px;padding:8px 10px;font-size:.92rem}.seqdone div b{font-family:var(--mono);color:var(--ok)}
.seqpool{display:grid;gap:6px}.seqpool button{text-align:left;font:500 .92rem var(--body);color:var(--ink);background:var(--bg);border:1.5px dashed var(--line);border-radius:7px;padding:9px 11px;cursor:pointer}
.seqpool button.shake{border-color:var(--bad);background:var(--badbg);border-style:solid;animation:sh .25s 2}
@keyframes sh{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
details summary{cursor:pointer}
figure img{display:block;width:100%;height:auto;border-radius:6px}
figcaption{font-size:.76rem;color:var(--muted);margin-top:4px}

:root{--blue:#2b6cb0;--g1:#2b6cb0;--g2:#B8770F;--g3:#23813A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--blue:#7FB6E6;--g1:#7FB6E6;--g2:#E2A83E;--g3:#5FD17A}}
.thead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:18px 0 10px}.thead h2{margin:0;font-size:1.35rem}.tstat{display:flex;flex-direction:column;align-items:flex-start;gap:2px;font-size:.92rem;text-align:left}
@media (max-width:620px){.tstat{align-items:flex-start}}
.area{margin-top:6px}
.seg{width:auto;flex-wrap:wrap}
.sum h3:first-child{margin-top:4px}.sum hr{border:0;border-top:2px dashed var(--line);margin:24px 0}
.sum ol.cols{columns:2;column-gap:28px;padding-left:22px}@media (max-width:700px){.sum ol.cols{columns:1}}
.exam{background:var(--okbg);border-left:4px solid var(--ok);border-radius:8px;padding:12px 14px;margin:14px 0}.exam strong{display:block;font:600 .82rem var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--ok);margin-bottom:4px}.exam ul{margin-bottom:0}
.formula{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.formula>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}.formula .big{display:block;font:800 1.3rem var(--mono);margin:6px 0;color:var(--olive)}.formula .sm{display:block;color:var(--muted)}@media (max-width:700px){.formula{grid-template-columns:1fr}}
.svgbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;margin:10px 0;max-width:520px}
svg.fig{display:block;width:100%;height:auto;max-width:640px;margin-inline:auto}svg.fig.lc{max-width:300px;margin-inline:auto}
.c{text-align:center}
/* questão */
.qi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.qhead{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.qhead .esc{margin-left:auto;font:700 .74rem var(--mono);color:var(--muted)}
.chip{display:inline-block;font:600 .66rem var(--display);text-transform:uppercase;letter-spacing:.08em;background:var(--surface2);color:var(--ink);border-radius:20px;padding:2px 9px}.chip.src{background:var(--warnbg);color:var(--warn)}.chip.gen{background:var(--okbg);color:var(--ok)}
.ctx{font:15px/1.5 var(--form);background:var(--paper);border:1px dashed var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px}

<script>
/* ================= CORE: dados, normalização, gerador e correção ================= */
const MON=['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
const MONEXT=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const P=a=>a[Math.floor(Math.random()*a.length)];
const CH=p=>Math.random()<p;
function SH(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pad=(n,l=2)=>String(n).padStart(l,'0');
function strip(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase()}
/* compacta: sem acento, sem espaço/pontuação, sem ordinais e sem "PQDT/PARAQUEDISTA" */
function cmp(s){return strip(s).replace(/PARA-?QUEDISTA|PQDT|GPB/g,'').replace(/[^A-Z0-9]/g,'')}
function nameN(s){return strip(s).replace(/[^A-Z ]/g,' ').replace(/\s+/g,' ').trim()}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

/* ---------- OM ---------- */
const OMS={
 '25BI':{sig:'25 BI',ext:'25º Batalhão de Infantaria Pára-quedista',al:['25BI','25BIPQDT','25BATALHAODEINFANTARIA']},
 '26BI':{sig:'26 BI',ext:'26º Batalhão de Infantaria Pára-quedista',al:['26BI','26BATALHAODEINFANTARIA']},
 '27BI':{sig:'27 BI',ext:'27º Batalhão de Infantaria Pára-quedista',al:['27BI','27BATALHAODEINFANTARIA']},
 'CIP':{sig:'CIP',ext:'Centro de Instrução Pára-quedista General Penha Brasil',al:['CIP','CI','CIPGPB','CENTRODEINSTRUCAO']},
 'CIAPREC':{sig:'Cia Prec',ext:'Companhia de Precursores Pára-quedista',al:['CIAPREC','CPREC','COMPANHIADEPRECURSORES']},
 'BDOMPSA':{sig:'B DOMPSA',ext:'Batalhão DOMPSA',al:['BDOMPSA','BTLDOMPSA','BATALHAODOMPSA','BATALHAODEDOBRAGEM']},
 'DSAU':{sig:'D Sau',ext:'Destacamento de Saúde Pára-quedista',al:['DSAU','DSTSAU','DESTACAMENTODESAUDE']},
 'CBDA':{sig:'C Bda',ext:'Comando da Brigada de Infantaria Pára-quedista',al:['CBDA','CMDOBDA','COMANDODABRIGADA']},
 'CCBDA':{sig:'CCBda',ext:'Companhia de Comando da Brigada de Infantaria Pára-quedista',al:['CCBDA','CIACBDA','CIACMDOBDA','COMPANHIADECOMANDO']},
 '21BIA':{sig:'21 Bia',ext:'21ª Bateria de Artilharia Antiaérea Pára-quedista',al:['21BIA','21BIAAAAE','21BATERIA']},
 '36PE':{sig:'36 PE',ext:'36º Pelotão de Polícia do Exército Pára-quedista',al:['36PE','36PELPE','36PELOTAO']},
 '20CC':{sig:'20 CC',ext:'20ª Companhia de Comunicações Pára-quedista',al:['20CC','20CCOM','20CIACOM','20CIACOMPQDT','20COMPANHIADECOMUNICACOES']},
 '1CEC':{sig:'1 CEC',ext:'1ª Companhia de Engenharia de Combate Pára-quedista',al:['1CEC','1CIAECMB','1CIAECMBPQDT','1COMPANHIADEENGENHARIA']},
 '20BL':{sig:'20 BL',ext:'20º Batalhão Logístico Pára-quedista',al:['20BL','20BLOG','20BATALHAOLOGISTICO']},
 '8GAC':{sig:'8 GAC',ext:'8º Grupo de Artilharia de Campanha Pára-quedista',al:['8GAC','8GRUPODEARTILHARIA']},
 '1ESQD':{sig:'1 Esqd C',ext:'1º Esquadrão de Cavalaria Pára-quedista',al:['1ESQDC','1ECP','1ESQD','1EC','1ESQUADRAODECAVALARIA']},
 'CIOE':{sig:'CIOE',ext:'Centro de Instrução de Operações Especiais',al:['CIOE','CIOPESP','CENTRODEINSTRUCAODEOPERACOESESPECIAIS']},
};
Object.values(OMS).forEach(o=>{o.al=[...new Set([...o.al,cmp(o.sig),cmp(o.ext)])]});
function omMatchCell(v,key){const c=cmp(v);return !!c&&OMS[key].al.includes(c)}
function omFind(text){const c=cmp(text);let best=null,bl=0;for(const[k,o]of Object.entries(OMS))for(const a of o.al){if(a.length>=2&&c.includes(a)&&a.length>bl){best=k;bl=a.length}}return best}

/* ---------- Posto/graduação ---------- */
const PGN={'GEN':'Gen','CEL':'Cel','TC':'TC','MAJ':'Maj','CAP':'Cap','1TEN':'1º Ten','2TEN':'2º Ten','ASP':'Asp','ST':'ST','1SGT':'1º Sgt','2SGT':'2º Sgt','3SGT':'3º Sgt','CB':'Cb','SD':'Sd','SO':'SO','1S':'1S','2S':'2S','3S':'3S'};
const OFIC=['GEN','CEL','TC','MAJ','CAP','1TEN','2TEN','ASP'];
function pgKey(v){let c=strip(v).replace(/[^A-Z0-9]/g,'');c=c.replace(/^ASPOF$/,'ASP').replace(/^TENCEL$/,'TC').replace(/^SUBTEN$|^SUBTENENTE$/,'ST').replace(/^GENBDA$|^GENDIV$/,'GEN').replace(/^SOLDADO$/,'SD').replace(/^CABO$/,'CB').replace(/^(\d)SG$/,'$1SGT').replace(/^(\d)TENENTE$/,'$1TEN').replace(/^CAPITAO$/,'CAP').replace(/^MAJOR$/,'MAJ').replace(/^CORONEL$/,'CEL');return c}
const pgLabel=k=>PGN[k]||k;

/* ---------- OBS ---------- */
const OBSAL={
 MSAV:['MSAV','MSDOAV','MESTREDESALTODOAVIAO'],MSEQ:['MSEQ','MSEQP','MSDEEQUIPE'],AUX:['AUX','AUXMS','AUXMSAV','AUXDOMS'],
 A1:['A1','AUX1','AUXMSNR1','AUXNR1'],A2:['A2','AUX2','AUXMSNR2','AUXNR2'],A3:['A3','AUX3','AUXMSNR3','AUXNR3'],
 OPINTER:['OPINTER','OPINTF','OPINT','OPERADORDEINTERFONE','OPINTERFONE'],SACA:['SACAPINO','SACAPINOS'],NAO:['NAOSALTA'],FALTOU:['FALTOU'],CINEG:['CINEGRAFISTA','CINEG','FILMAGEM','EQPFILMAGEM'],RTBS:['RTBS'],
 CHPREC:['CHEQPPREC','CHEQPREC','CHEFEEQPPREC','CHEFEDAEQUIPEDEPRECURSORES','CHPREC'],PREC:['PREC','PRECURSOR'],AUXPREC:['AUXPREC','AUXILIARDEPRECURSOR'],
 DOMPSA:['DOMPSA'],AUXDOMPSA:['AUXDOMPSA'],MEDICO:['MEDICO','MED','MEDICODAMISSAO'],
};
['P1A','P1F','P2A','P2B','P2D','P2E','P2RM'].forEach(k=>OBSAL[k]=[k]);
const OBSLBL={MSAV:'Ms Av',MSEQ:'Ms Eq',AUX:'Aux',A1:'A-1',A2:'A-2',A3:'A-3',OPINTER:'Op Inter',SACA:'SACA-PINO',NAO:'Não salta',FALTOU:'Faltou',CINEG:'Cinegrafista',RTBS:'RTBS',CHPREC:'Ch Eqp Prec',PREC:'Prec',AUXPREC:'Aux Prec',DOMPSA:'DOMPSA',AUXDOMPSA:'Aux DOMPSA',MEDICO:'Médico',P1A:'P-1A',P1F:'P-1F',P2A:'P-2A',P2B:'P-2B',P2D:'P-2D',P2E:'P-2E',P2RM:'P-2RM'};
function obsKey(v){const c=cmp(v);if(!c)return '';for(const[k,a]of Object.entries(OBSAL))if(a.includes(c))return k;return '?'+c}

/* ---------- nomes ---------- */
const FN=['ALEXANDRE','BRUNO','CAIO','DANILO','EDUARDO','FELIPE','GUSTAVO','HEITOR','IGOR','JOAQUIM','LEANDRO','MARCELO','NATAN','OTÁVIO','PAULO','RAFAEL','SÉRGIO','TIAGO','VINÍCIUS','WAGNER','ANDERSON','BENTO','CLÁUDIO','DIOGO','ÉRICO','FÁBIO','GILBERTO','HUGO','ÍTALO','JÚLIO','LUCAS','MATEUS','NELSON','RENATO','SAMUEL','TEODORO','VALTER','YURI','ARTUR','CÉSAR','DOUGLAS','ENZO','FRANCISCO','GABRIEL','HENRIQUE','JOSÉ','LEONARDO','MÁRCIO','RODRIGO','VICTOR','ANA','BEATRIZ','CAMILA','DÉBORA','LARISSA','MARIANA','PATRÍCIA','RENATA','TAÍS','VANESSA'];
const SN=['ALMEIDA','BARBOSA','CARDOSO','DANTAS','ESTEVES','FALCÃO','GUIMARÃES','HOLANDA','IGLESIAS','JARDIM','LACERDA','MEDEIROS','NOGUEIRA','OLIVEIRA','PEIXOTO','QUEIROZ','RAMALHO','SAMPAIO','TAVARES','UCHOA','VASCONCELOS','XAVIER','ZANETTI','AGUIAR','BRAGANÇA','CAVALCANTI','DUARTE','FIGUEIREDO','GALVÃO','LEMOS','MACHADO','NASCIMENTO','PACHECO','RESENDE','SALES','TEIXEIRA','VALADARES','ARAGÃO','BITTENCOURT','CAMARGO','DORNELES','FONTOURA','GUSMÃO','LINHARES','MONTEIRO','PAIVA','ROCHA','SIQUEIRA','TORRES','VIANA','AZEVEDO','BRANDÃO','CORDEIRO','FARIAS','LOBO','MOURA','PRADO','SEIXAS','VALENTE','CUNHA'];
const usedNames=new Set(),usedNr=new Set(),usedG=new Set();
function person(pgk,omk){
  let fn,m,l,full,guerra;do{fn=P(FN);m=P(SN);l=P(SN);full=`${fn} ${m} ${l}`;guerra=CH(.6)?l:m}while(m===l||usedNames.has(full)||usedG.has(guerra));usedNames.add(full);usedG.add(guerra);let nr;do{nr=String(R(160000,199999))}while(usedNr.has(nr));usedNr.add(nr);
  return {pg:pgk,om:omk,nome:full,guerra,nr,idt:`0${R(10000000,29999999)}-${R(0,9)}`};
}
function fullHTML(p){return esc(p.nome).replace(new RegExp('\\b'+esc(p.guerra)+'\\b'),'<b>'+esc(p.guerra)+'</b>')}
function pgName(p){return `${pgLabel(p.pg)} ${fullHTML(p)}`}

/* ---------- aeronaves, ZL, aeródromos ---------- */
const AV={
 'C-105':{uae:[['1º/15º GAV','ONÇA'],['1º/9º GAV','ARARA']],nr:()=>'23'+R(20,39),carga:true,funcs:['MSEQ','AUX','OPINTER','A2']},
 'C-95':{uae:[['1º/5º GAV','RUMBA']],nr:()=>'2'+R(300,399),carga:false,funcs:['MSEQ','AUX']},
 'KC-390':{uae:[['1º/1º GTT','GORDO']],nr:()=>'28'+R(50,59),carga:false,funcs:['MSEQ','A1','A2','A3']},
 'C-130':{uae:[['1º/1º GTT','GORDO']],nr:()=>'2'+R(460,479),carga:false,funcs:['MSEQ','A1','A2','A3']},
};
const ZLS=[['GERICINÓ','RJ','MATO MÉDIO COM CUPINZEIROS E ÁRVORES ESPAÇADAS'],['ITAGUAÍ GRANDE','RJ','MATO ALTO COM CUPINZEIROS'],['MARAMBAIA','RJ','AREIA COM VEGETAÇÃO RASTEIRA'],['SANTA CRUZ','RJ','GRAMA BAIXA COM TERRENO PLANO'],['RESENDE','RJ','GRAMA MÉDIA COM ÁRVORES ESPAÇADAS'],['FORMOSA','GO','CAMPO LIMPO COM CUPINZEIROS'],['ANÁPOLIS','GO','GRAMA BAIXA COM PEDRAS ESPARSAS'],['PONTA PORÃ','MS','CAMPO LIMPO COM MATO BAIXO'],['MANAUS','AM','CAPIM ALTO COM ÁREAS ALAGADIÇAS'],['PORTO VELHO','RO','CAMPO LIMPO COM ÁRVORES ESPARSAS'],['RIO BRANCO','AC','PASTO BAIXO COM CUPINZEIROS']];
const ADRM={AFONSOS:['AFONSOS','RJ','P'],GALEAO:['GALEÃO','RJ','P'],SANTACRUZ:['SANTA CRUZ','RJ','P'],ANAPOLIS:['ANÁPOLIS','GO','P'],CAMPOGRANDE:['CAMPO GRANDE','MS','Q'],MANAUS:['MANAUS','AM','Q'],PORTOVELHO:['PORTO VELHO','RO','Q'],RIOBRANCO:['RIO BRANCO','AC','R']};
const ZONEOFF={O:-2,P:-3,Q:-4,R:-5};

/* ---------- códigos de missão ---------- */
function codMis(m){return `${m.viagem?'VL':'L'}-${m.nat}${m.fardo?'X':'H'}${m.carga?'C':''}${m.form?'G':''}-${m.noite?'N':'D'}`}

/* ---------- formatos ---------- */
function fmtData(d){return `${pad(d.d)} ${MON[d.m]} ${pad(d.y%100)}`}
function fmtDataExt(d){return `${pad(d.d)} de ${MONEXT[d.m]} de ${d.y}`}
function fmtHora(t){return `${pad(t.h)}${pad(t.mi)}${t.z}`}
function fmtDur(min){return `${pad(Math.floor(min/60))}h${pad(min%60)}min`}
function fmtDTG(d,t,lower){const s=`${pad(d.d)}${pad(t.h)}${pad(t.mi)}${MON[d.m]}${pad(d.y%100)}`;return lower?s.slice(0,6)+MON[d.m].toLowerCase()+pad(d.y%100):s}
const toUTC=t=>t.h*60+t.mi-ZONEOFF[t.z]*60;

/* ---------- parsers ---------- */
function parseHora(v){const s=strip(v).replace(/\s+/g,'');const m=s.match(/^(\d{1,2})[:H]?(\d{2})(?:MIN)?([OPQR])?$/);if(!m)return null;const h=+m[1],mi=+m[2];if(h>23||mi>59)return null;return {h,mi,z:m[3]||''}}
function parseDur(v){const s=strip(v).replace(/\s+/g,'');let m=s.match(/^(\d{1,2})H(\d{1,2})(?:MIN|M)?$/)||s.match(/^(\d{1,2}):(\d{2})$/);if(m)return +m[1]*60+ +m[2];m=s.match(/^(\d{1,3})(?:MIN|M)$/);if(m)return +m[1];return null}

/* ================= GERADOR PQ-6 (continuação) ================= */
const FASES=[['aterragem','por ocasião da aterragem'],['saida','por ocasião da saída da aeronave'],['abertura','durante a abertura do paraquedas']];
const LESOES=['torcer o tornozelo','fraturar o punho','luxar o ombro','sofrer uma entorse no joelho','sofrer escoriações na face'];
function genPQ6(S){
  const m=S.mission;

  const r=P(cand);const v=r.p;

  if(S.prec.length&&others.length<3)others.push(S.prec[1][0]);
  while(others.length<3){others.push(S.subs.length?S.subs[0].s:S.rows[0].p)}
  const fase=P(FASES);const vento=R(2,12);const saltos=R(5,180);const nMil=R(5,16),nF=(S.fardos||[]).length;const efetivo=nMil+nF;
  const rtbs=r.exp.obs==='RTBS';

  const txt=`Ainda considerando o mesmo salto, durante a saída da ${passIdx>=1?['','segunda','terceira','quarta'][Math.min(3,passIdx)]:'primeira'} equipe, o ${pgName(v)}, Nr Pqdt ${v.nr}, ${artOM(v.om)}, Idt Nr ${v.idt} (MD), acidentou-se ${fase[1]}, vindo a ${P(LESOES)}. O acidente ocorreu às ${pad(tAcc.h)}:${pad(tAcc.mi)} hora local.<br><br>Foram testemunhas do ocorrido:<br>${others.map(p=>`- ${pgName(p)}, Idt ${p.idt} (MD);`).join('<br>')}<br><br>O Chefe da Equipe Terra informou que a velocidade do vento era de ${vento} nós. O militar informou que possuía ${saltos} saltos. Na passagem em que ocorreu o acidente saltaram ${nMil} militares da equipe, incluindo o MS${nF?(nF===1?` e foi lançado o fardo ${S.fardos[0].pac}`:` e foram lançados ${nF} fardos`):''}.<br><br>Realize o preenchimento da <b>PQ-6</b>.`;
  return {v,omV:v.om,tAcc,wit:others,fase,vento,saltos,efetivo,nat,lado,rtbs,txt,oficial:OFIC.includes(v.pg)};

    $('#'+el.id+'_c').addEventListener('click',flip,{once:true});$('#'+el.id+'_c').addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();flip()}},{once:true})}

function realOf(m){return m.part==='S'?'carga':m.real}
function cEncode(m){const lanc=m.fin==='lanc';let g1=(m.tipo==='viagem'?'V':'')+(lanc?'L':'')+(lanc&&m.exec!=='semi'?m.exec:'');if(!g1)g1='T';let g2=m.nat+m.part;if(lanc){if(realOf(m)==='carga'&&m.part!=='S')g2+='C';if(m.form==='formatura')g2+='G'}return [g1,g2,m.hor]}
const cCode=m=>cEncode(m).join('-');
function codeHTML(c){const g=Array.isArray(c)?c:c.split('-');return `<span class="code"><span class="g1">${g[0]}</span><span class="hy">-</span><span class="g2">${g[1]}</span><span class="hy">-</span><span class="g3">${g[2]}</span></span>`}
function cSentence(m){const T=m.tipo==='viagem'?'Viagem':'Voo';if(m.fin==='aero')return `${T} de aerotransporte, ${CNATP[m.nat]}, ${CPARTP[m.part]}, ${CHORP[m.hor]}.`;const r=realOf(m)==='carga'?'pela porta de carga ou rampa':'pela porta de salto';const f=m.form==='formatura'?'aeronaves em formatura':'aeronave isolada';return `${T} com lançamento, ${CEXECP[m.exec]}, ${CNATP[m.nat]}, ${CPARTP[m.part]}, ${r}, ${f}, ${CHORP[m.hor]}.`}
function cReasons(m){const lanc=m.fin==='lanc',L=[];L.push(['Tipo',m.tipo==='viagem'?'Viagem → <span class="chipc c1">V</span>':'Voo → sem letra']);L.push(['Finalidade',lanc?'Lançamento → <span class="chipc c1">L</span>':'Aerotransporte → sem letra própria']);
  if(lanc)L.push(['Execução',m.exec==='semi'?'Semiautomático → sem letra':`${CEXEC[m.exec]} → <span class="chipc c1">${m.exec}</span>`]);else L.push(['Execução','Não existe em aerotransporte (regra e)']);
  const g1=cEncode(m)[0];L.push(['1º grupo',g1==='T'?'voo + aerotransporte → <span class="chipc c1">T</span>':`→ <span class="chipc c1">${g1}</span>`]);
  L.push(['Natureza',`${CNAT[m.nat]} → <span class="chipc c2">${m.nat}</span>`]);L.push(['Participantes',`${CPART[m.part]} → <span class="chipc c2">${m.part}</span>`]);
  if(!lanc){L.push(['Realização','não existe em aerotransporte (regra f)']);L.push(['Formatura','não existe em aerotransporte (regra g)'])}
  else{if(m.part==='S')L.push(['Realização','material pesado → porta de carga implícita, <b>sem C</b> (regra m)']);else L.push(['Realização',m.real==='carga'?'porta de carga/rampa → <span class="chipc c2">C</span>':'porta de salto → sem letra (regra k)']);L.push(['Formatura',m.form==='formatura'?'em formatura → <span class="chipc c2">G</span>':'aeronave isolada → sem letra (regra l)'])}
  L.push(['Horário',`${CHOR[m.hor]} → <span class="chipc c3">${m.hor}</span>`]);return L}
const cWhy=m=>`<ul class="why">${cReasons(m).map(([k,v])=>`<li><span class="k">${k}</span><span>${v}</span></li>`).join('')}</ul>`;
function normCode(s){return strip(s).replace(/[‐-―−–—]/g,'-').replace(/\s+/g,'').replace(/-+/g,'-')}
function cDecode(str){const s=normCode(str);const g=s.split('-');if(g.length!==3||g.some(x=>!x))return {err:'O código tem três grupos separados por hífen (1.43.2).'};const [a,b,c]=g,m={};
  if(a==='T'){m.tipo='voo';m.fin='aero'}else{let r=a;if(r[0]==='V'){m.tipo='viagem';r=r.slice(1)}else m.tipo='voo';if(r===''){if(m.tipo==='voo')return {err:'1º grupo vazio.'};m.fin='aero'}else if(r[0]==='L'){m.fin='lanc';r=r.slice(1);if(r==='')m.exec='semi';else if(r.length===1&&'EGRL'.includes(r))m.exec=r;else return {err:`Depois do L só pode vir uma letra de execução (E, G, R ou L).`}}else return {err:`1º grupo “${a}” inválido. Válidos: T, V, L, LE, LG, LR, LL, VL, VLE, VLG, VLR, VLL.`};if(m.tipo==='voo'&&m.fin==='aero')return {err:'Voo de aerotransporte se escreve T.'}}
  if(!CNAT[b[0]])return {err:`Natureza “${b[0]}” não existe.`};m.nat=b[0];if(!b[1]||!CPART[b[1]])return {err:'Participantes: H Y X F S.'};m.part=b[1];let r=b.slice(2);
  if(m.fin==='aero'){if(r)return {err:'Em aerotransporte o 2º grupo tem só 2 letras (regras f e g).'}}else{m.real='salto';m.form='isolada';if(r[0]==='C'){if(m.part==='S')return {err:'Material pesado (S) não leva C (regra m).'};m.real='carga';r=r.slice(1)}if(r==='G'){m.form='formatura';r=''}if(r)return {err:`Sobrou “${r}” no 2º grupo.`};if(m.part==='S')m.real='carga'}
  if(!CHOR[c])return {err:'3º grupo: D, N, DN ou ND.'};m.hor=c;return {m}}
function cRandom(){const m={tipo:CH(.55)?'voo':'viagem',fin:CH(.72)?'lanc':'aero',nat:P(Object.keys(CNAT)),hor:P(['D','D','N','N','DN','ND'])};
  if(m.fin==='aero'){m.part=P(['H','H','Y','X','F','S']);m.exec='semi';m.real='salto';m.form='isolada';return m}
  m.exec=P(['semi','semi','semi','E','G','G','R','L']);const byExec={semi:['H','H','Y','X','F'],E:['S'],G:['F','S'],R:['F','S'],L:['H','X']};m.part=P(byExec[m.exec]);
  if(m.part==='S'||m.exec==='E'||m.exec==='G'||m.exec==='R')m.real='carga';else m.real=CH(.4)?'carga':'salto';m.form=CH(.4)?'formatura':'isolada';return m}
const V_NAT={A:['de adestramento'],D:['de demonstração'],I:['de instrução'],M:['de manobra','tático'],O:['de operações','de combate'],S:['de salvamento','de socorro'],B:['de busca'],R:['de reconhecimento'],U:['de resgate'],C:['de competição'],E:['de ensaio','de pesquisa']};
const V_PART={H:['com pessoal','com paraquedistas'],Y:['com pessoal e animal','com pessoal e cães de guerra'],X:['misto (pessoal e material leve)','com pessoal e material leve'],F:['com material leve'],S:['com material pesado','com carga pesada']};
const V_EXEC={semi:['semiautomático'],E:['por extração','com extração'],G:['por gravidade','por liberação'],R:['rasante'],L:['livre','em queda livre']};
const V_HOR={D:['diurno','de dia'],N:['noturno','à noite'],DN:['diurno-noturno','iniciado de dia e concluído à noite'],ND:['noturno-diurno','iniciado à noite e concluído de dia']};
function cStatement(m){const traps=[];const T=m.tipo==='viagem'?'viagem':'voo';let head;
  if(m.fin==='aero'){if(CH(.45)){head=T;traps.push('<b>Finalidade omitida</b> → aerotransporte (regra n).')}else head=`${T} de aerotransporte`}else head=`${T} com lançamento`;
  const fr=[];if(m.fin==='lanc'){if(m.exec==='semi'){if(CH(.5))fr.push('semiautomático');else traps.push('Execução não citada → <b>semiautomático</b>, sem letra (regra o).')}else fr.push(P(V_EXEC[m.exec]))}
  fr.push(P(V_NAT[m.nat]));fr.push(P(V_PART[m.part]));
  if(m.fin==='lanc'){if(m.part==='S'){if(CH(.6)){fr.push(P(['pela rampa','pela porta de carga']));traps.push('Porta de carga citada, mas com <b>material pesado não se escreve C</b> (regra m).')}else traps.push('Material pesado: porta de carga implícita, sem C (regra m).')}
    else if(m.real==='carga')fr.push(P(['pela porta de carga','pela rampa']));else{if(CH(.5))fr.push(P(['pela porta lateral','pela porta de salto']));else traps.push('Porta não citada → <b>porta lateral</b>, sem letra (regra o).')}
    if(m.form==='formatura')fr.push(P(['em formatura','com aeronaves em formatura']));else{if(CH(.5))fr.push('aeronave isolada');else traps.push('Formatura não citada → <b>aeronave isolada</b>, sem letra (regra o).')}}
  else if(CH(.2)){fr.push('em formatura');traps.push('“Em formatura” num aerotransporte <b>não se codifica</b> (regra g).')}
  fr.push(P(V_HOR[m.hor]));let parts;if(CH(.3)){parts=SH([head,...fr]);traps.push('Enunciado fora de ordem: o código mantém a ordem padrão (regra b).')}else parts=[head,...fr];let s=parts.join(', ');s=s[0].toUpperCase()+s.slice(1)+'.';return {text:s,traps}}

<p>O MS Av recorda os procedimentos e estuda a ZL na carta/esboço/foto aérea (reconhecer pontos nítidos e orientar a reorganização). <b>Características da ZL que interessam ao MS Av: natureza do solo · obstáculos internos e externos · dimensões e limites · entrada da Anv para o lançamento.</b> Deve conhecer o itinerário de voo (manter-se orientado pela ligação com o piloto).</p>
<h3>Equipagem e ajustagem (1.14)</h3>
<div class="tbl"><table><tr><th>Anv</th><th>Dispositivo</th></tr><tr><td>KC-390</td><td>coluna por quatro, frente para o interior, duas a duas</td></tr><tr><td>C-105</td><td>coluna por dois, frente para o interior, uma a uma</td></tr><tr><td>C-95</td><td>coluna por um</td></tr></table></div>
<p>Comandos: <b>“PREPARAR PARA EQUIPAR!”</b> e <b>“EQUIPAR!”</b>.</p>
<h3>Inspeção dos saltadores (1.15)</h3>
<ul class="plain"><li>O MS Av inspeciona, podendo ser auxiliado por outros MS presentes.</li><li>Se o MS Av está no briefing com a FAB: inspecionam o <b>Aux MS Av e os possuidores do curso de MS</b> solicitados (responsabilidade do MS Av e do Aux MS Av).</li><li>Ao término, perguntar: <b>“ALGUÉM DEIXOU DE SER INSPECIONADO?”</b></li></ul>
<h3>Divisão e organização das equipes (1.16)</h3>
<p><b>Considerar:</b> nº de passagens acertado no briefing combinado (1ª da Eqp Prec, se houver) · nº máximo de homens por porta da ZL · situação tática e necessidade da missão.</p>
<ol type="a"><li>cada fardo corresponde a um Pqdt;</li><li>no máximo <b>1 fardo por porta</b>;</li><li>o fardo é <b>sempre o primeiro</b> a ser lançado na sua porta;</li><li>atrás do fardo saem o MS e os encarregados de resgatá-lo;</li><li>Pqdt com pacote saem <b>o mais à frente possível</b>;</li><li>pacotes divididos entre as equipes da forma mais equitativa;</li><li>integridade das frações: <b>carregamento cruzado</b> (dividir frações em aeronaves diferentes para não perder a fração inteira);</li><li>cão: <b>na frente da 1ª equipe, com o cinófilo, priorizado até sobre o fardo</b>;</li><li>paraquedas diferentes na mesma equipe (MC1-C e T-10B): <b>agrupar os de mesmo tipo à frente ou à retaguarda</b>.</li></ol>
<h3>Devolução (1.17)</h3>
<ul class="plain"><li>Responsabilidade do MS Av, que mantém o controle durante toda a missão.</li><li>Salto realizado → <b>P Col Mat Aet</b> (local definido em briefing).</li><li>Salto cancelado → <b>Seç Distr M Aet, na ordem inversa da PQ-2</b>.</li></ul>
${EXAM(`<ul class="plain"><li>Item de “C ou I” com o texto do recebimento: “<u>sem cobertura</u> (I → com cobertura) · <u>mangas abaixadas</u> (C) · <u>ordem rigorosa das equipes</u> (I → ordem rigorosa do manifesto, PQ-2) · <u>formatura da aeronave</u> (C)”.</li><li>“Que procedimento foi lembrado pelo Aux nº 1 após a inspeção?” → perguntar <b>“ALGUÉM DEIXOU DE SER INSPECIONADO?”</b></li><li>“T10-B e MC1-C intercalados na mesma equipe está certo?” → <b>Não</b>; os de mesmo tipo ficam agrupados à frente ou à retaguarda.</li></ul>`)}`,

aer:`
<h3>Medidas de segurança nos aeródromos (1.18)</h3>
<ul class="plain"><li>Tropa em forma ou em descanso nos locais fixados pelo comando do aeródromo.</li><li>Antes de cruzar pistas: <b>fazer alto</b>, observar se não há Anv decolando/pousando, <b>aguardar autorização do elemento designado da Eqp Prec</b> e atravessar <b>em acelerado</b>.</li></ul>
<div class="tbl"><table><tr><th>Sinal da torre</th><th>Significado</th></tr><tr><td>Verde contínua</td><td>passagem permitida, livre travessia de pista ou livre decolagem</td></tr><tr><td>Vermelha contínua</td><td>mantenha a posição e aguarde (“Pare. Não avance”)</td></tr><tr><td>Verde intermitente</td><td>táxi de viatura pela pista de rolagem até a margem ou cabeceira</td></tr><tr><td>Vermelha intermitente</td><td>abandonar as pistas</td></tr><tr><td>Branca intermitente</td><td>regresse ao estacionamento</td></tr></table></div>
<p>Viaturas: travessia em <b>marcha de força</b>; só trafegam nas pistas autorizadas ou com guia (<b>Vtr Siga-me</b>); bandeira de <b>1 m × 1 m quadriculada laranja e branca</b>.</p>
<p><b>Proibições:</b> (a) tocar nas aeronaves sem autorização; (b) fumar num raio de <b>15 m</b> de qualquer aeronave ou posto de abastecimento; (c) passar por baixo das hélices em qualquer situação; (d) passar na frente de Anv com motores funcionando e se aproximar das hélices; (e) passar a menos de <b>20 m da frente</b> de avião a jato e a menos de <b>50 m da cauda</b>.</p>
<h3>Definições (1.19)</h3>
<div class="tbl"><table><tr><th>Termo</th><th>Definição</th></tr>
<tr><td>Aeródromo</td><td>área destinada, <b>total ou parcialmente</b>, a chegadas, partidas, movimentos e <b>serviços</b> de aeronaves. Deve possuir pista de pouso e decolagem, pista de rolamento, área de estacionamento, área de sinalização, sala de tráfego, torre de controle e hangar.</td></tr>
<tr><td>Campo de pouso</td><td>área destinada a chegadas, partidas e movimentos, <b>sem qualquer auxílio à navegação</b>; deve possuir pista de pouso e decolagem.</td></tr>
<tr><td>Pista de pouso e decolagem</td><td>faixa com piso apropriado (pavimentado ou não: grama, cascalho, concreto, asfalto). <b>C-95 50×800 m · C-105 50×900 m · KC-390 50×1100 m</b>.</td></tr>
<tr><td>Pista de rolagem</td><td>faixa por onde circulam as Anv antes da decolagem e após a aterragem, <b>ligando as cabeceiras à área de estacionamento</b>.</td></tr>
<tr><td>Cabeceiras</td><td>extremidades da pista; recebem o nº da entrada em graus, em dezenas: 80º e 260º → <b>08 (zero oito) e 26 (dois meia)</b>.</td></tr>
<tr><td>Área de estacionamento</td><td>onde as Anv carregam/descarregam e permanecem em pernoite.</td></tr>
<tr><td>Box</td><td>espaço demarcado (faixas amarelas/brancas, gramado ou balizado) no estacionamento, numerado ou não.</td></tr>
<tr><td>Pista em uso</td><td>designada pelo controle do aeródromo para pousos e decolagens.</td></tr>
<tr><td>Área de sinalização</td><td>superfície destinada à exibição de sinais fixos no solo.</td></tr>
<tr><td>Torre de controle</td><td>órgão dos serviços de tráfego aéreo e controle de pessoas e viaturas; pintada de <b>vermelho e branco em quadriculado</b>.</td></tr>
<tr><td>Hangar</td><td>galpão para manutenção, estacionamento ou guarda das Anv.</td></tr>
<tr><td>Táxi</td><td>deslocamento da Anv na pista de rolagem, do estacionamento até a pista ou vice-versa.</td></tr></table></div>
<h3>Segurança no voo (1.20)</h3>
<p><b>Antes da decolagem:</b> conhecer o itinerário (no briefing) · receber o <b>“PRONTO”</b> do encarregado da inspeção da Anv (<b>A1 no KC-390, Op Inter no C-105, Aux MS no C-95</b>) · todos nos lugares certos, <b>cinto ajustado e capacete na cabeça</b> · proibir o fumo a bordo · cintos só liberados mediante ordem · recordar os <b>toques de campainha</b> · recordar a conduta em aterragem forçada/amerissagem, aterragem sobre água/árvore/fio, Pqdt preso, tipo de reorganização · mostrar saídas de emergência, extintores, coletes e machadinhas (viagens).</p>
<p><b>Durante o voo:</b> manter ligação com o piloto pelo Op Inter · determinar colocação/liberação dos cintos · permitir retirar capacetes e afrouxar o equipamento nas viagens.</p>
<p><b>Antes do pouso</b> (se não houve lançamento ou ficou alguém a bordo — MS Av, ou Aux MS no C-95/C-105, ou A1 no KC-390): determinar que todos sentem e comandar <b>“COLOCAR OS CINTOS DE SEGURANÇA!”</b> e <b>“AJUSTAR OS CAPACETES!”</b>.</p>
<h3>Segurança durante os lançamentos (1.21)</h3>
<p><b>Antes da saída do 1º:</b> reajuste do equipamento · inspeção do pessoal · comando “<b>VERIFICAR EQUIPAMENTO</b>”, após o qual MS e auxiliares: (1) observam se todos seguram corretamente o gancho; (2) verificam se a fita passa <b>por sobre o ombro</b>; (3) conferem o nº de homens; (4) verificam se os ganchos têm <b>pino de segurança</b> e <b>abertura voltada para a fuselagem</b>; (5) se a contagem (“Contar”) for interrompida, os Aux verificam e corrigem. Atentar para a campainha; na identificação do ponto, os <b>auxiliares interpretam os toques e repassam ao MS</b>.</p>
<p><b>Após a saída do 1º</b> (MS, e o Aux no cobaia): controlar a <b>cadência</b>, a fita por cima do ombro e o <b>tempo de saída</b>, interrompendo se houver perigo (atentar para o <b>TLV</b>).</p>
${EXAM(`<ul class="plain"><li>Correlação de colunas: aeródromo × campo de pouso × pista de pouso e decolagem × pista de rolagem.</li><li>“Militar passou por baixo das hélices. Que outras ações são proibidas?” → tocar nas Anv sem autorização · fumar a menos de 15 m · passar à frente de Anv com motores ligados · passar a menos de 20 m da frente/50 m da cauda de jato.</li><li>“Procedimentos fiscalizados dentro da aeronave” → ocupação correta dos assentos, capacete ajustado, cinto de segurança e atenção aos toques de campainha.</li></ul>`)}
${TRAP('aeródromo = “total ou parcialmente… e serviços”; campo de pouso = “sem qualquer auxílio à navegação”. A distância do jato é dupla: 20 m da frente e 50 m da cauda.')}`,

lanc:`
<h3>Corrida para a ZL (1.22)</h3>
<p>Identificação de <b>pontos nítidos, localizados e locados previamente</b> no terreno ou na carta, <b>a 1 minuto da ZL</b>, que orientam o MS na “<b>final para o lançamento</b>”.</p>
<h3>Circuito da aeronave (1.23)</h3>
<p>Trajeto básico para o lançamento: pela esquerda ou pela direita. <b>Prioritariamente pela esquerda</b>, para o MS observar a ZL durante o <b>través</b>. Pontos, na ordem do voo: <b>curva do través → través → curva base → final → ZL</b>.</p>
<div id="circDemo"></div>
<h3>Classificação dos lançamentos (1.24)</h3>
<div class="tbl"><table><tr><th>Critério</th><th>Tipos</th></tr>
<tr><td>Quanto ao paraquedas</td><td><b>Semiautomático (enganchado):</b> a abertura depende apenas de enganchar · <b>Livre (comandado):</b> o Pqdt comanda a abertura após queda livre.</td></tr>
<tr><td>Quanto ao tipo</td><td><b>Luz verde (LV):</b> comandado pelo precursor do solo, sem ponto materializado; MS lança no acender da luz verde (silêncio eletrônico <b>permite</b> rádio) · <b>Vertical do ponto (VTC):</b> MS lança na vertical do ponto materializado pela Eqp Prec (silêncio eletrônico <b>não permite</b> rádio) · <b>Precursor (Prec):</b> sem ponto no solo; o precursor de bordo calcula mentalmente, escolhe o ponto, corrige a Anv e lança · <b>Sonda (Son):</b> lançador de bordo usa sonda · <b>Lançamento de Bordo (LB):</b> elevado grau de surpresa; recomendado para voo em formação, ressuprimento, exigência tática ou sem Eqp Prec — <b>LBP</b> (pesado, extraído por paraquedas de extração) e <b>LBR</b> (rasante, 3 a 10 pés sobre a zona de extração) · <b>Lançamento Livre (LL):</b> acima de 2.200 pés do nível da ZL; só instrução e treinamento básico.</td></tr>
<tr><td>Quanto à forma</td><td><b>Normal:</b> o MS lança a equipe saindo à frente dela · <b>Cobaia:</b> o MS, sem saltar, lança a equipe · <b>Misto:</b> pessoal e material leve; o MS lança o fardo após dar o “Já” à equipe e sai logo após o fardo, à frente da equipe · <b>Extração:</b> material pesado extraído pela rampa por paraquedas · <b>Liberação ou gravidade:</b> material pesado sai pela ação da gravidade.</td></tr></table></div>
<h3>Lançamento de cães (1.25)</h3>
<p>Forma normal ou cobaia; cães nos <b>primeiros lugares</b> da equipe; sempre que possível lançado <b>como pacote junto ao cinófilo</b>; em casos especiais, como fardo (o cinófilo o reorganiza); <b>cada cão conta como um elemento</b> da equipe no cálculo dos saltadores.</p>
<h3>Sinais para o lançamento (1.26)</h3>
<div class="tbl"><table><tr><th>Sinal</th><th>Momento</th><th>Significado</th></tr>
<tr><td>Luz vermelha</td><td><b>4 min</b> antes do início da ZL, no início do través (<b>6 min</b> na passagem única ou força maior, acertado previamente)</td><td>alerta ao MS para iniciar os comandos</td></tr>
<tr><td>“Na rota”</td><td><b>12 a 8 s</b> antes do ponto de lançamento</td><td>Op Inter → MS, após o piloto informar. Anv nas condições: velocidade dentro dos limites; direção e altura previstas; <b>asas horizontalizadas</b>; <b>cauda baixa</b> (no C-95, cauda elevada). O MS dá “<b>À PORTA</b>” (que <b>não</b> é sinal de lançamento).</td></tr>
<tr><td>Luz verde (LV)</td><td>no ponto de saída</td><td>o MS comanda “JÁ”</td></tr>
<tr><td>Luz verde (VTC)</td><td><b>10 a 6 s</b> antes do ponto</td><td>o MS acusa “Luz verde”, identifica o ponto e verifica a configuração</td></tr>
<tr><td>Advertência</td><td>linha de painéis/luzes <b>150 m antes</b> do ponto</td><td>previne o MS da localização e das condições do ponto</td></tr>
<tr><td>Ponto de lançamento</td><td>letra código</td><td>“JÁ” na vertical da <b>extremidade (limite) anterior do primeiro painel ou luz</b></td></tr></table></div>
${EXAM(`<ul class="plain"><li>Circuito: identificar setores 1, 2, 3 (curva do través, través, curva base) e onde se recebe o “na rota” (<b>nº 4 · final</b>).</li><li>Tabela “sinal × momento exato”: luz vermelha (4 ou <b>6 min</b> se passagem única), “na rota” 12–8 s, luz verde 10–6 s, advertência 150 m antes, ponto na vertical do limite anterior do 1º painel.</li><li>“Condições da aeronave antes do ‘à porta’” → horizontalidade das asas, altura e direção previstas, velocidade dentro dos limites e cauda baixa.</li></ul>`)}
${TRAP('luz vermelha a 4 min é a regra; na passagem ÚNICA é 6 min. “À porta” é comando, não sinal. Na luz verde (LV) o JÁ é na luz; na VTC a luz acende 10–6 s antes e o JÁ é no ponto.')}`,

zl:`
<h3>Voo em formação (1.27)</h3>
<ul class="plain"><li>Reunião de duas ou mais Anv no mesmo sentido e sob um mesmo comando; usado nas Missões de Transporte Aet para emprego <b>em massa</b> em curto prazo.</li><li>Maior manobrabilidade e flexibilidade: <b>elemento de 2 aviões</b>.</li><li><b>Formação tática básica (in trail):</b> preferencial no lançamento em massa; concentra a tropa na área central da ZL; muda a geometria rapidamente; <b>até 3 Anv por elemento</b>; distância conforme nº de Pqdt por porta e dimensões (visualização, esteira de turbulência).</li><li>VTC em formação: os <b>líderes passam com a fuselagem sobre a letra</b>; o MS da Anv <b>Ala 3</b> lança pela <b>porta da direita</b> no KC-390 (se definido em briefing).</li><li>C-95: formação em <b>escalão à direita</b>; na VTC o ala 3 escalona à direita do ala 2 (o C-95 só tem porta esquerda).</li><li>Vento pode exigir lançamento <b>em coluna</b>, na trajetória do líder. Afastamento lateral maior que o previsto dificulta ver as correções do líder e pode lançar fora dos limites laterais.</li><li>Glossário: <b>elemento</b> (2 ou 3 Anv; no mínimo 2 do mesmo tipo) · <b>seção</b> (normalmente 3 Anv de transporte) · <b>série</b> (aviões do mesmo tipo, mesma área de partida, comando único, para uma ZL/ZA) · <b>vaga</b> (helicópteros em operação aeromóvel / séries homogêneas).</li></ul>
<h3>Zona de lançamento (1.28)</h3>
<ul class="plain"><li>Área útil do terreno (terra ou massa d’água) que, reconhecida e com margens de segurança, pode ser usada para lançar pessoal e material. Pequenos obstáculos internos não impedem.</li>
<li><b>Dimensão mínima:</b> pessoal <b>200 m × 200 m</b> · lançamento pesado <b>400 m de largura × 600 m de profundidade</b>.</li>
<li><b>Largura</b> = dimensão perpendicular à entrada da Anv; condicionada pelo tipo de formação. <b>Comprimento</b> = o maior possível; condiciona o NHPP e o tempo de luz verde.</li></ul>
<div class="tbl"><table><tr><th>Voo</th><th>Anv</th><th>Pqdt</th><th>HPP</th><th>Comp × Lrg mín</th></tr>
<tr><td rowspan="3">Aeronave isolada</td><td>KC-390</td><td>64</td><td>32</td><td>2600 × 200 m</td></tr><tr><td>C-105</td><td>20</td><td>20</td><td>1450 × 200 m</td></tr><tr><td>C-95</td><td>12</td><td>12</td><td>1000 × 200 m</td></tr>
<tr><td rowspan="3">Elemento tático (2 Anv, in trail)</td><td>KC-390</td><td>128</td><td>32</td><td>2600 × 500 m</td></tr><tr><td>C-105</td><td>40</td><td>20</td><td>1450 × 500 m</td></tr><tr><td>C-95</td><td>24</td><td>12</td><td>1000 × 500 m</td></tr>
<tr><td>Elemento básico (3 Anv)</td><td colspan="4">sem possibilidade de lançamento de tropa ou material (nova concepção da aviação de transporte)</td></tr></table></div>
<div class="formula"><div><b>NHPP</b> (número de homens por porta) <span class="big">N = (L − S) ÷ V</span><span class="sm">L = comprimento da ZL · S = margem de segurança (definida pelo precursor, conforme obstáculos externos) · V = velocidade da Anv em relação ao solo. Definido em briefing pelo precursor. Arredonde <b>para baixo</b>.</span></div>
<div><b>TLV</b> (tempo para luz vermelha · RLT) <span class="big">TLV = L ÷ V</span><span class="sm">Tempo em que a luz verde fica acesa sobre a ZL, contado após o “JÁ” do precursor (Prec de bordo ou luz verde/comando rádio) ou do MS (vertical da letra código).</span></div></div>
<div class="tbl"><table><tr><th>Anv</th><th>Velocidade de lançamento de Pqdt</th></tr><tr><td>KC-390 e C-105</td><td><b>70 m/s</b> (125 kt)</td></tr><tr><td>C-95</td><td><b>60 m/s</b> (110 kt)</td></tr><tr><td>HM-1/2/3/4</td><td>45 m/s (90 kt)</td></tr></table></div>
<p class="sm">Na prova, use a velocidade dada no anexo (na 24/1: <b>130 nós = 70 m/s</b>). Exemplo da prova: N = (2200 − 100) ÷ 70 = <b>30</b>; TLV = 2200 ÷ 70 = <b>31 s</b>.</p>
<ul class="plain"><li><b>Operação de ZL</b> — inserir forças de combate e apoios: (a) selecionar, infiltrar, reconhecer e confirmar; (b) estabelecer e mobiliar a ZL; (c) lançar e reorganizar a tropa.</li><li><b>Área de salto</b> — dimensões de uma ZL mínima de pessoal (200 × 200 m) <b>sem margens de segurança</b>; condições excepcionais (selva, pantanal, caatinga, montanha).</li><li><b>ZL aquática</b> — massa d’água livre de obstáculos com 200×200 (pessoal) ou 400×600 (material); limites a no mínimo <b>300 m</b> das margens/obstáculos; profundidade mínima <b>5 m</b>; sem rochas, pedras, árvores submersas ou fundo lodoso.</li></ul>
<h3>Identificação da ZL (1.29)</h3>
<p>Várias ZL numa área: afastadas entre si; se não for possível, horários diferentes; todas identificadas (letras-código com painéis, eletrônicos ou lanternas, fumígenos, faróis rotativos…). Letras, frequências, cores e ângulo do farol nas <b>IEComElt</b>. O fumígeno fica perto do ponto, sem atrapalhar a visualização, observando o vento.</p>
${EXAM(`<ul class="plain"><li>“Informe o número de homens por porta que a ZL comporta. Apresente fórmula e cálculos” → N = (L − S)/V.</li><li>“Por que a ZL está dentro do tamanho mínimo?” → mínimo de <b>200 m × 200 m</b> para pessoal.</li><li>“Confira o tempo para luz vermelha de 31 s” → TLV = D/V = 2200/70 ≈ 31 s.</li></ul>`)}
${TRAP('no NHPP desconta a margem de segurança; no TLV, não (MT: comprimento ÷ velocidade). L é o COMPRIMENTO (profundidade, no sentido da entrada), não a largura.')}`,

eqt:`
<h3>Equipe terra (1.30–1.31)</h3>
<p>Grupo organizado para <b>operar uma ZL</b>, <b>chefiado por um precursor</b>; responsável pela segurança e eficiência dos lançamentos. Missões: (a) estabelecer meios eletrônicos auxiliares à navegação; (b) <b>locar o ponto de lançamento</b>; (c) estabelecer meios auxiliares à reorganização; (d) prestar primeiros socorros; (e) providenciar o salvamento de quem aterrar em local perigoso.</p>
<div class="tbl"><table><tr><th>Turma</th><th>Composição mínima</th></tr><tr><td>Chefe da Eqp Terra</td><td>1 Of/S Ten/Sgt Prec</td></tr><tr><td>Tu Precursores</td><td>1 Of/S Ten/Sgt Prec + 2 Cb/Sd Aux Prec</td></tr><tr><td>Tu DOMPSA</td><td>1 Of/S Ten/Sgt DOMPSA + 1 Cb/Sd Aux DOMPSA</td></tr><tr><td>Tu Saúde</td><td>1 Of médico + 1 S Ten/Sgt enfermeiro + 1 Cb/Sd socorrista</td></tr><tr><td>Tu Apoio</td><td>motoristas (Tu Prec, Tu DOMPSA, ambulâncias); <b>não saltam</b></td></tr><tr><td>Tu Salvamento</td><td>busca, salvamento e resgate fora da ZL ou em local de difícil acesso; comum em saltos em massa d’água</td></tr></table></div>
<h3>Equipe precursora (1.32)</h3>
<p>Elementos da equipe terra <b>que realizam o salto</b>. <b>Composição mínima:</b> 1 Of/S Ten/Sgt Prec (Ch Eqp Prec) · 1 Of/S Ten/Sgt Prec · 1 Cb/Sd Aux Prec · 1 Of/S Ten/Sgt DOMPSA · 1 Of médico.</p>
<div class="tbl"><table><tr><th>Adestramento e instrução</th><th>C-95</th><th>C-105 e KC-390</th></tr><tr><td>Ch Eqp Prec (Of/S Ten/Sgt)</td><td>1</td><td>1</td></tr><tr><td>Prec (Of/S Ten/Sgt)</td><td>1</td><td>1</td></tr><tr><td>Aux Prec (Cb/Sd)</td><td><b>1</b></td><td><b>2</b></td></tr><tr><td>DOMPSA (Of/S Ten/Sgt)</td><td>1</td><td>1</td></tr><tr><td>Aux DOMPSA (Cb/Sd)</td><td>1</td><td>1</td></tr><tr><td>Médico ou enfermeiro (S Ten/Sgt)</td><td>1</td><td>1</td></tr><tr><td><b>Efetivo</b></td><td><b>6</b></td><td><b>7</b></td></tr></table></div>
<h3>Ponto de lançamento e letra código (1.33)</h3>
<ul class="plain"><li><b>Ponto de lançamento:</b> materializado com painéis coloridos ou luzes em forma de letra-código; o lançamento começa na vertical da <b>extremidade anterior do primeiro painel ou luz</b>.</li><li><b>Letra-código:</b> autentica a ZL e serve de ponto materializado. Letras possíveis nas Op ZL: <b>C, E, F, J, K, L, T e Y</b> (IEComElt).</li><li><b>Linha de advertência:</b> 4 painéis a <b>150 m</b> do primeiro painel da perna; indica se a letra está <b>normal ou impedida</b>. Diurno: 20 m entre os painéis do centro e 10 m da extremidade ao centro.</li><li>Letra e advertência têm <b>sempre a mesma configuração</b>. Fora do padrão da IEComElt → <b>descaracterizada: não lançar</b>.</li><li>Prisma pode ficar <b>50 m após a letra</b>, alinhado com o eixo (rumo de entrada).</li><li>Painéis diurnos: <b>Prec/Dom 1</b> branco/vermelho · <b>Prec/Dom 2</b> amarelo/vermelho · <b>Prec/Dom 3</b> azul/vermelho.</li><li><b>Noturno:</b> lâmpadas; perna com luzes a <b>3 m</b> e braços a <b>6 m</b>; advertência com 10 m entre as luzes do centro e 5 m da extremidade ao centro; luzes estroboscópicas no início e no fim da ZL, a no mínimo <b>300 m</b> da perna; cores <b>âmbar</b> (normal) e <b>vermelha</b> (impedimento).</li></ul>
<div class="two"><div id="lcDemo1"></div><div id="lcDemo2"></div></div>
<div class="tbl"><table><tr><th>Situação</th><th>Letra</th><th>Advertência</th><th>MS</th></tr><tr><td>Normal</td><td>todos os painéis na cor normal</td><td>4 normais</td><td>lança (“JÁ” no limite anterior do 1º painel)</td></tr><tr><td>Impedimento <b>temporário</b></td><td>letra completa, com os <b>2 primeiros painéis da perna</b> em vermelho</td><td>2 painéis centrais vermelhos</td><td>não lança por determinado tempo (passagem perdida)</td></tr><tr><td>Impedimento <b>definitivo</b></td><td><b>só a perna</b> (os braços retirados), 2 primeiros vermelhos</td><td>2 centrais vermelhos</td><td>missão cancelada; não lança</td></tr><tr><td>Descaracterizada</td><td>fora do padrão da IEComElt</td><td>—</td><td>não lança</td></tr></table></div>
<h3>Impedimentos de solo (1.33.4)</h3>
<p>Sinalizados quando: (a) vento no solo acima do limite: <b>13 nós (diurno) e 10 nós (noturno)</b>; (b) Anv fora da rota; (c) Pqdt no ar sobre a ZL; (d) ocorrências momentâneas que ofereçam perigo.</p>
${EXAM(`<ul class="plain"><li>“Quantidade mínima e funções da equipe precursora numa Anv igual à do Ala 2 (KC-390)” → tabela de adestramento: <b>7 militares</b> (Ch Eqp Prec, Prec, 2 Aux Prec, DOMPSA, Aux DOMPSA, médico).</li><li>Figura da letra “T” com advertência: “Em qual configuração estava? O que ocorreria?” → <b>impedimento</b> (2 primeiros painéis da perna e 2 centrais da advertência vermelhos): não se dá o JÁ.</li><li>“Duas linhas de ação: HSO D/0200h × D/1000h. O que muda?” → limite de vento: <b>13 kt diurno, 10 kt noturno</b>.</li></ul>`)}
${TRAP('na prova 24/1 foi aceito “300 metros” para a distância advertência–letra no lançamento NOTURNO. O MT só traz 150 m (1.26.2.4 e 1.33.1.3) e usa 300 m para as luzes estroboscópicas. Confirme com o instrutor qual valor ele cobra.')}`,

reo:`
<h3>Reorganização (1.34)</h3>
<ul class="plain"><li>Reagrupamento no solo, de pessoal e material, em <b>L Reo</b> previamente estabelecidos, para posterior encaminhamento às <b>Z Reu</b>.</li><li>Concretiza-se com <b>80% do efetivo reunido e as comunicações estabelecidas</b>. Se necessário, a segurança pode ser prejudicada em benefício da rapidez e do controle.</li><li><b>Z Reu:</b> local coberto e/ou abrigado, próximo à ZL, de onde a tropa cumprirá a missão. <b>L Reo:</b> pontos dentro da ZL onde a tropa se reorganiza e verifica faltas/baixas; balizados por bandeirolas de cores; tantos quantos necessários.</li></ul>
<p><b>Fatores para escolher o tipo:</b> possibilidades do inimigo, terreno, natureza da operação, condições meteorológicas e condições técnicas da tropa.</p>
<div class="tbl"><table><tr><th>Tipo</th><th>Como é</th><th>Quando</th></tr>
<tr><td><b>Balizada</b></td><td>de cada L Reo/Z Reu parte uma fileira de identificadores (bandeirolas) até a área provável de aterragem; mesma cor por local</td><td>locais de <b>difícil identificação</b>, tropa com <b>pouca experiência</b>, inimigo <b>remoto</b></td></tr>
<tr><td><b>Direta</b></td><td>deslocamento direto da área de aterragem até os L Reo/Z Reu, identificados por painéis/fumígenos de mesma cor</td><td>áreas <b>facilmente identificadas</b>, <b>inconfundíveis na topografia</b></td></tr>
<tr><td><b>Especial ou mista</b></td><td>aproveita acidentes do terreno para se <b>homiziar</b>; pode usar balizada ou direta até o acidente</td><td>terreno com caminhos, trilhas, taludes, renques, valões que dispensam o balizamento</td></tr></table></div>
<p><b>Planejamento:</b> estudo conjunto do Cmt da tropa com os chefes das equipes DOMPSA e de precursores; a Eqp Prec aciona os meios auxiliares (visuais, acústicos, eletrônicos) e a segurança da ZL. O estudo Cmt × Ch Eqp Prec aborda: tipo de reorganização; estudo da ZL; informações sobre a ZL; auxílios que serão empregados; distribuição de homens e material por aviões.</p>
<p><b>Estudo da ZL:</b> na carta, foto aérea, maquete ou <b>caixão de areia</b>, para fixar Z Reu, L Reo, <b>CCR</b> e itinerários. O <b>CCR</b> fica no <b>centro da área provável de aterragem</b> (centro da elipse de dispersão), com a bandeirola “<b>SIGA-ME</b>”. Fases da preparação: <b>estudo com a tropa → ensaio → execução</b>.</p>
<p><b>Considerações finais:</b> avião isolado → reorganizar em torno do <b>MS ou dos fardos</b>; marcações na frente e atrás dos capacetes conforme o L Reo; quantidade de L Reo decidida pelo <b>Cmt tático</b>, assessorado pelo Cmt da Eqp Prec.</p>
${EXAM(`<ul class="plain"><li>“Correu até o L Reo próximo, de fácil identificação e inconfundível na topografia. Qual reorganização?” → <b>direta</b> (sem balizamento, pontos nítidos no terreno).</li></ul>`)}
${TRAP('a reorganização está concretizada com 80% + comunicações, não 100%.')}`,

brf:`
<h3>Briefing (1.35)</h3>
<p>Reunião entre a Força Aérea e a tropa a ser lançada/aerotransportada, que <b>precede toda missão aeroterrestre</b>, para recordar normas e esclarecer detalhes da missão.</p>
<div class="tbl"><table><tr><th>Tipo</th><th>Entre</th><th>Dirigido por</th><th>Participantes</th></tr>
<tr><td><b>Particular (pré-briefing)</b></td><td>participantes da <b>unidade Pqdt</b> (detalhes da tropa e procedimentos das funções)</td><td><b>O Lig da GU Pqdt</b></td><td>O Lig e Aux · Prec · DOMPSA · médico · MS Av · Op Inter / Aux MS Av / A1</td></tr>
<tr><td><b>Geral</b></td><td>unidade Pqdt + FAB, operações de <b>grande envergadura</b></td><td><b>A3 (GU Aérea) ou E3 (GU Pqdt)</b></td><td>A3 · E3 · O Lig e Aux · pilotos · Prec · DOMPSA · MS dos aviões · Cmt da tropa</td></tr>
<tr><td><b>Combinado</b></td><td>unidade Pqdt + FAB, operações de <b>pequena envergadura</b> (ex.: saltos de adestramento e instrução)</td><td><b>S3 da Unidade da FAB</b></td><td>S3 da U F Ae · O Lig e Aux · pilotos · mecânicos · MS dos aviões · Op Inter/Aux MS Av/A1 · Prec · DOMPSA · médico</td></tr></table></div>
<h3>Pontos importantes</h3>
<p><b>Aerotransporte:</b> designação dos aviões · quadro-horário (embarque, guarnecer, decolagem, duração) · natureza · efetivo · material · itinerário · altura · sinais e fraseologia do interfone · emergência.</p>
<p><b>Lançamento:</b> designação dos aviões · tipo de lançamento · quadro horário · participantes · natureza · <b>localização da ZL (entrada e corrida)</b> · altura · nº de decolagens e passagens · nº e tipo de fardos · plano e processo de lançamento dos fardos · sinais e fraseologia · emergência · sequência para o lançamento (luzes e correções) · letra-código · ligação terra-avião · tipo de painel da Eqp Prec · sinais avião–Eqp Prec · frequência rádio.</p>
<h3>Briefing do MS Av com os saltadores (1.35.5)</h3>
<ol class="steps"><li><b>Informações iniciais:</b> apresentação do MS e auxiliares; detalhes; tipo de lançamento; tipo de Anv; altura; características da ZL (natureza do solo, obstáculos internos e externos, dimensões, limites e entrada da Anv).</li>
<li><b>Segurança nos aeródromos:</b> não fumar sem autorização; não passar ao redor de hélices/turbinas em funcionamento; mover-se rápido e embarcar com vivacidade.</li>
<li><b>Dentro da aeronave:</b> ocupar os assentos da frente (perto da cabine) para a retaguarda; cuidado com o punho do reserva; cuidado com a própria fita e a do militar à frente; atenção ao MS ao entrar; recordar os toques de campainha.</li>
<li><b>Durante o salto:</b> entregar a fita e entrar à porta; boa saída (impulso para frente e para cima, posição “JEB”); contar e verificar o velame; giro do horizonte, olhar a ZL, desvios, anular oscilações; meios de navegação, navegar para dentro da ZL, contra o vento; mochila/pacote: olhar para baixo e liberar; <b>a 10 m do solo preparar para aterrar</b>; desequipar deitado; recolher o Pqd olhando para cima quando a Anv passar; retirar material caído na pista; ir ao L Reo em acelerado; não tirar o capacete na ZL.</li>
<li><b>Emergência:</b> panes totais (charuto, secção de fita, secção de ancoragem); panes parciais (mae west, bandeira, cigarrete); Pqdt preso; entrelaçamento; aterragem; sobre pista; árvore; água; alta/baixa tensão; quem não consegue reorganizar sinaliza acionando o reserva.</li>
<li><b>Reorganização:</b> tipo; local; entrega do Pqd; participar ao MS qualquer problema.</li></ol>
${EXAM(`<ul class="plain"><li>“Briefing entre FAB e tropa, dirigido pelo oficial de operações da Unidade da FAB” → <b>combinado</b>.</li><li>“Quais características da ZL interessam ao MS Av?” → natureza do solo, obstáculos internos e externos, dimensões e limites, entrada da Anv.</li><li>“Que auxiliar o Sr chamou para o briefing combinado?” → <b>A1</b> (KC-390) · Op Inter (C-105) · Aux MS Av (C-95).</li></ul>`)}
${TRAP('o particular é conduzido pelo O Lig (só gente da unidade Pqdt); o combinado é dirigido pelo S3 da unidade da FAB; o geral, pelo A3 ou E3.')}`,

RESUMO.doc=`<h3>As dez partes qualificadas</h3>
  <p>Partes qualificadas (PQ) são os documentos aeroterrestres padronizados da GU Pqdt (MT 1.38; NGA Aet 2.2). Na prova, <b>a PQ-2 e a PQ-6 são para preencher</b>. Das outras, basta saber <b>o número e o que cada uma é</b>.</p>
  <div class="pqgrid" id="pqgrid"></div>

  <h3>Como decorar sem decorar</h3>
  <p>Leia as dez em <b>cinco pares</b>, na ordem em que a missão acontece:</p>
  <div class="tbl"><table>
    <thead><tr><th>Par</th><th>Ideia</th><th>As duas PQ</th></tr></thead>
    <tbody>
      <tr><td class="n">1 · 10</td><td><b>Planejar</b> (as pontas da lista)</td><td>PQ-1 diz <i>quais missões</i> haverá · PQ-10 coordena a <i>viagem</i> com a FAB (raio de 100 km)</td></tr>
      <tr><td class="n">2 · 3</td><td><b>Embarcar</b> — os manifestos</td><td>PQ-2 manifesto de <i>pessoal</i> (e de aerotransporte) · PQ-3 manifesto de <i>material pesado</i></td></tr>
      <tr><td class="n">5 · 6</td><td><b>Registrar ocorrências</b></td><td>PQ-5 relatório do Ch Eqp Terra · PQ-6 parte de acidente</td></tr>
      <tr><td class="n">4 · 7 · 8</td><td><b>Contar saltos</b>, período crescente</td><td>PQ-4 <i>mês</i> (registro) → PQ-7 <i>trimestre</i> → PQ-8 <i>ano</i></td></tr>
      <tr><td class="n">9</td><td><b>Levar os saltos</b> ao ser transferido</td><td>PQ-9 declaração de saltos para a OM de destino</td></tr>
    </tbody>
  </table></div>
  <div class="callout"><strong>Frase para fixar:</strong> “Planejo (1), embarco gente (2) e carga (3), registro no mês (4), a terra relata (5), o acidente vira parte (6), somo no trimestre (7) e no ano (8), declaro na saída (9) e combino a viagem com a FAB (10).”</div>

  <h3>Números que caem</h3>
  <div class="tbl"><table>
    <thead><tr><th>PQ</th><th>Dado</th><th>Fonte</th></tr></thead>
    <tbody>
      <tr><td class="n">PQ-1</td><td>Feita pela 3ª Seç EMG da GU Pqdt até o <b>penúltimo dia útil</b> do mês anterior</td><td>MT 1.38.1</td></tr>
      <tr><td class="n">PQ-2</td><td><b>5 vias</b>: 1ª P Distr Mat Aet (DOMPSA) · 2ª O Lig (3ª Seç GU) · 3ª 3ª Seç da OM · 4ª tripulação · 5ª P Col Mat Aet (DOMPSA). Em aerotransporte: <b>Manifesto de Aerotransporte</b></td><td>MT 1.38.2</td></tr>
      <tr><td class="n">PQ-3</td><td><b>4 vias</b> (DOMPSA · O Lig · 3ª Seç OM, que fica com o ML · tripulação)</td><td>MT 1.38.3</td></tr>
      <tr><td class="n">PQ-5</td><td>Modelo <b>diferente</b> para salto semiautomático, lançamento de carga e salto livre</td><td>MT 1.38.5</td></tr>
      <tr><td class="n">PQ-6</td><td>Preenchida <b>no local</b> pelo MS · encaminhada à OM do militar · 3ª Seç tem <b>3 dias úteis</b> · publicada em <b>BI</b></td><td>MT 1.38.6</td></tr>
      <tr><td class="n">PQ-7</td><td>Até <b>30 dias</b> após o trimestre · BI em ordem hierárquica e alfabética</td><td>MT 1.38.7</td></tr>
      <tr><td class="n">PQ-8</td><td>Até <b>20 FEV</b> de cada ano</td><td>MT 1.38.8</td></tr>
      <tr><td class="n">PQ-9</td><td><b>2 vias</b>: arquivo na OM · OM de destino</td><td>MT 1.38.9</td></tr>
      <tr><td class="n">PQ-10</td><td>Raio de <b>100 km</b> do aeródromo de partida · anexo: quadro de execução</td><td>MT 1.38.10</td></tr>
    </tbody>
  </table></div>
  <div class="trap"><b>Nomes que mudam entre as fontes:</b> PQ-1 “Mensal” (MT) × “Periódico” (NGA 2023) · PQ-3 “de Carga” (MT) × “de Material Pesado” (NGA e gabarito) · PQ-7/8 “Cotas” (MT) × “Quotas” (NGA). O exercício do curso diz que a PQ-3 tem 3 vias; o MT diz 4. Nas questões, os dois nomes são aceitos. Confirme com o instrutor qual versão a prova segue.</div>
  <p class="muted sm">A NGA 2023 também lista, como anexos, documentos que não são PQ: RMA (Relatório de Missão Aeroterrestre), RIAP (incidente/acidente com paraquedas), RIALAS (incidente/acidente no lançamento aéreo e suprimento), RPM (perda de material) e SMC/SMCE (solicitação de missão conjunta).</p>
`;
RESUMO.pq2=`<div class="exam"><strong>Como caiu na prova 24/1 (item 7 · 38 escores)</strong><ul class="plain"><li>Briefing com 20 informações (a–t) + extrato da PQ-1 (Anexo C) + manifesto pré-impresso com as linhas 8 a 12.</li><li>Gabarito: <b>24 ABR 24 · 39 · C-105 (2476) · 1º Av · L-AXC-D · AFONSOS (RJ) · 1000 PÉS · PREC/LV/VTC · 3 · 3º Sgt ARMANDO · 0805P · 0830P · 00h25min · Rec Pqd 240740ABR24 · MS Av xxx</b>.</li><li>Corpo: Eqp Prec nas linhas 1–7 · linha 8 riscada (baixou) + xxx · 9 P2-B · 10 nome corrigido (JONAS → JANDERSON) + xxx · 11 RTBS · 12 OM corrigida (27 BI → 1 CEC) + xxx · 13 Ms Eq · 14 Ms Av · 15 Aux MS · 16 Op Inter · 17 fardo “A7 – RAC – BRANCO – 85 LB” (20 CC) · 18 saca-pino · 8 substituto (21 Bia) + xxx.</li><li>Faça essa PQ-2 no simulador: “Prova 24/1 (real)”.</li></ul></div>
  <p>Tudo o que está aqui foi tirado do <b>gabarito do curso</b> (exercícios 1 e 2), do MT e da NGA. O que é convenção do gabarito sem regra escrita nas fontes está marcado.</p>

  <div class="callout gold"><strong>Ordem de preenchimento do corpo (memento):</strong> Eqp Prec → saltadores → MS/Aux MS/Op Inter → fardo → saca-pino → substituições → acréscimos.
  <div class="tbl" style="margin:8px 0 0"><table><thead><tr><th>C-95</th><th>C-105</th><th>C-130 / KC-390</th></tr></thead><tbody><tr><td>Eqp Prec (SFC)<br>Saltadores<br>Ms Eq<br>Ms Av<br>Aux MS<br>Fardo</td><td>Eqp Prec (SFC)<br>Saltadores<br>Ms Eq<br>Ms Av<br>Aux MS<br>A2<br>Op Inter<br>Fardo<br>Saca-pino</td><td>Eqp Prec (SFC)<br>Saltadores<br>Ms Eq<br>Ms Av<br>A1 · A2 · A3<br>Fardo<br>2 saca-pinos</td></tr></tbody></table></div>
  <p class="sm" style="margin:6px 0 0">Tabela escrita à mão no modelo do instrutor. Depois vêm as substituições e, por último, os acréscimos.</p></div>
  <h3>Observações do memento (todas cobradas)</h3>
  <ul class="plain">
    <li>Letra de forma. <b>Sublinhar todos os nomes de guerra</b> (no corpo e no campo 10 só o nome de guerra).</li>
    <li>No máximo <b>5 alterações</b> (erros, faltas e substituições). <b>Adicionar militar não é alteração.</b></li>
    <li><b>Rubricar (xxx)</b> erros corrigidos, substituições e acréscimos. Riscar militares que faltaram: OBS “<b>FALTOU</b> xxx”; quem é substituído: “<b>NÃO SALTA</b> xxx”.</li>
    <li>Militar de outra OM só salta na sua Anv com <b>autorização do O Lig</b>. Equipes de filmagem, visitantes etc. <b>entram no manifesto</b> (OBS “CINEGRAFISTA” no modelo).</li>
    <li>OBS: <b>funções e pacotes</b>. Fardo: <b>TIPO – PQD – COR – PESO</b> (ex.: A-5 – RAC – VERDE – 150 LB).</li>
    <li>Horários: <b>arredondar para o múltiplo de 5 mais próximo</b> (unidade 1–2 desce para 0; 3–4 sobe para 5; 6–7 desce para 5; 8–9 sobe para 0) + letra do fuso: R (−5 Acre) · Q (−4 Manaus) · P (−3 Brasília) · O (−2 Fernando de Noronha). Duração em horas e minutos: 00h45min.</li>
    <li>Rec Pqd: <b>GDH completo</b> (070830 ABR 23). Assinar no campo 27. Se não vier o nome do MS, nome fictício que não identifique o aluno.</li>
    <li>Inscrição das OM: Cia Prec · CIP · B DOMPSA · D SAU · C Bda · CCBda · 20 CC · 25 BI · 26 BI · 27 BI · 36 PE · 1 CEC · 21 Bia. Na ZL, <b>colocar o estado</b>: GERICINÓ (RJ).</li>
    <li>Fechar a PQ-2 com <b>traços à régua</b>.</li>
  </ul>
  <details class="card" style="margin-block:10px"><summary><b>Ver o modelo de PQ-2 do instrutor (07 ABR 23)</b></summary><img id="imgModel2" alt="Modelo de PQ-2 preenchido pelo instrutor" style="margin-top:10px;border:1px solid var(--line)"></details>
  <h3>Método para a prova (seis passos)</h3>
  <ol class="steps">
    <li><b>Leia o briefing inteiro</b> e numere mentalmente cada informação. Cada letra (a, b, c…) tem um destino na PQ-2 — nada sobra. No simulador, toque no item para riscá-lo quando usar.</li>
    <li><b>Cabeçalho, campos 1 a 17</b>, na ordem.</li>
    <li><b>Corpo:</b> Eqp Prec nas primeiras linhas (se houver lançamento precursor) → percorra a lista corrigindo (OM, nome, OBS, riscos).</li>
    <li><b>Acrescente no fim:</b> funções que não estavam na lista (Ms Eq → Ms Av → Aux/A1/A2/A3/Op Inter) → fardo → saca-pinos → substitutos (com o nº de ordem de quem saiu) → acréscimos.</li>
    <li><b>Feche:</b> inutilize as linhas em branco (traço diagonal), campo 26 (DTG do recebimento dos Pqd) e assinatura no 27.</li>
    <li><b>Confira</b> o que mais derruba: nº de passagens × tipos · código da missão · tempo de voo (fusos).</li>
  </ol>

  <h3>Cabeçalho, campo a campo</h3>
  <div class="tbl"><table>
    <thead><tr><th>Nº</th><th>Campo</th><th>O que escrever</th><th>Gabarito</th></tr></thead>
